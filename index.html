<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231B2A41%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22%230E9B8A%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EAI%3C/text%3E%3C/svg%3E">
<title>AI 職場應用實作工作坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>:root {
  --navy: #1B2A41; --navy2: #24364F; --ink: #0B1220; --teal: #0E9B8A; --tealDark: #0A7A6C;
  --mint: #E6F7F3; --mint2: #CFF0E8; --coral: #F0705A; --coralBg: #FEF1EE; --amber: #F5B942;
  --off: #F5F7F9; --line: #DCE3EA; --grey: #5B6775; --grey2: #9AA5B1; --slate: #3A4A60; --white: #fff;
  --fs: 18px; --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: var(--fs); line-height: 1.65; color: var(--ink); background: var(--white); padding-bottom: 84px; }
button { font: inherit; cursor: pointer; }
a { color: var(--tealDark); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* 頂列 */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--navy); color: var(--white); }
.brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
.units { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.units button { border: 0; border-radius: 999px; padding: 6px 14px; background: var(--navy2); color: var(--mint2); font-size: 16px; white-space: nowrap; min-height: 40px; }
.units button.on { background: var(--teal); color: var(--white); font-weight: 700; }
.units button.done::after { content: ' ✓'; }
.mine-btn { border: 1px solid var(--mint2); background: transparent; color: var(--white); border-radius: 999px; padding: 6px 14px; font-size: 16px; min-height: 40px; white-space: nowrap; }

/* 舞台 */
.stage { max-width: 1040px; margin: 0 auto; padding: 28px 24px 40px; outline: none; }
.seg-head { margin-bottom: 22px; }
.seg-code { display: inline-block; background: var(--mint); color: var(--tealDark); font-weight: 700; font-size: 16px; padding: 2px 12px; border-radius: 999px; margin-bottom: 8px; }
.seg-code .u { color: var(--grey); font-weight: 500; margin-left: 6px; }
h1 { font-size: 30px; line-height: 1.35; margin: 0 0 6px; }
.sub { color: var(--grey); margin: 0; }
.block { margin: 20px 0; }
.wip { background: var(--off); border-radius: var(--radius); padding: 24px; color: var(--grey); }

/* 通用卡 */
.callout { background: var(--mint); color: var(--tealDark); font-weight: 700; border-radius: var(--radius); padding: 16px 20px; }
.callout.dark { background: var(--navy); color: var(--white); }
.source { color: var(--grey2); font-size: 16px; }
.resource { display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: start; background: var(--mint); border-radius: var(--radius); padding: 16px 18px; border: 1px solid var(--mint2); }
.res-ico { width: 46px; height: 46px; border-radius: 14px; background: var(--teal); color: var(--white); display: grid; place-items: center; font-size: 28px; font-weight: 700; }
.res-body b { color: var(--tealDark); font-size: 20px; display: block; margin-bottom: 2px; }
.res-body p { margin: 0 0 10px; color: var(--grey); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two > div, .rows > div, .steps > div { background: var(--off); border-radius: var(--radius); padding: 16px 20px; }
.two h3 { margin: 0 0 4px; font-size: 20px; color: var(--tealDark); }
.two p { margin: 0; }
.rows { display: grid; gap: 10px; }
.rows > div { display: grid; grid-template-columns: 44px 220px 1fr; align-items: center; gap: 12px; }
.num { width: 36px; height: 36px; border-radius: 9px; background: var(--teal); color: var(--white); font-weight: 700; display: grid; place-items: center; font-size: 16px; }
.rows b { font-size: 19px; }
.rows span { color: var(--grey); }
.rows span.num { color: var(--white); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; counter-reset: s; }
.steps > div { border-top: 5px solid var(--teal); }
.steps b { display: block; font-size: 19px; margin-bottom: 4px; }
.howto { color: var(--grey); padding-left: 1.2em; margin: 0; }

/* 展開卡 */
.expand { display: grid; gap: 10px; }
.expand.grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.xcard { border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); overflow: hidden; }
.xcard > button { width: 100%; text-align: left; border: 0; background: var(--off); padding: 14px 18px; font-size: 19px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; }
.xcard > button::after { content: '＋'; color: var(--teal); font-size: 22px; }
.xcard.open > button { background: var(--mint); }
.xcard.open > button::after { content: '－'; }
.xcard .xbody { display: none; padding: 14px 18px; white-space: pre-line; }
.xcard.open .xbody { display: block; }
.hint { color: var(--grey); font-size: 16px; }

/* 翻卡 */
.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.flip { perspective: 900px; width: 100%; height: 190px; border: 0; background: none; padding: 0; text-align: left; }
.flip .in { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.flip.on .in { transform: rotateY(180deg); }
.flip .f, .flip .b { position: absolute; inset: 0; border-radius: var(--radius); backface-visibility: hidden; padding: 18px; display: flex; flex-direction: column; justify-content: center; }
.flip .f { background: var(--navy); color: var(--white); }
.flip .f .big { font-size: 56px; font-weight: 700; color: var(--teal); line-height: 1; }
.flip .f .nm { font-size: 20px; font-weight: 700; margin-top: 8px; }
.flip .b { background: var(--mint); color: var(--ink); transform: rotateY(180deg); font-size: 18px; }
.flip .b b { color: var(--tealDark); display: block; margin-bottom: 6px; }
.flip .tap { position: absolute; right: 14px; bottom: 10px; font-size: 14px; color: var(--mint2); }

/* 技能卡 */
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.skill { height: 260px; }
.skill .f { justify-content: flex-start; }
.skill .f .big { font-size: 52px; }
.skill .f .tg { color: var(--mint2); font-size: 16px; margin-top: 8px; }
.skill .chip { position: absolute; top: 16px; right: 16px; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--amber); color: var(--ink); }
.skill.locked .f { background: var(--slate); }
.skill.locked .f .big { color: #8FA0B5; }
.skill.locked .chip { background: #5B6B80; color: var(--white); }
.skill .b { font-size: 16px; line-height: 1.55; justify-content: flex-start; overflow: auto; }
.skill .b p { margin: 0 0 6px; }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.unlock-hero { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
.unlock-hero .skill { height: 320px; }
.takeaway { background: var(--off); border-radius: var(--radius); padding: 18px 22px; }
.takeaway h3 { margin: 0 0 10px; color: var(--teal); font-size: 18px; }
.takeaway div { margin-bottom: 12px; }
.takeaway b { font-size: 19px; display: block; }
.takeaway span { color: var(--grey); }
.confetti { font-size: 22px; font-weight: 700; color: var(--tealDark); margin-bottom: 8px; }

/* 高亮拆解 */
.hl-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.hl-tabs button { border: 2px solid var(--line); background: var(--white); border-radius: 10px; min-width: 64px; min-height: 48px; font-weight: 700; font-size: 20px; }
.hl-tabs button.on { border-color: var(--teal); background: var(--teal); color: var(--white); }
.hl-text { background: var(--off); border-radius: var(--radius); padding: 20px; font-size: 20px; line-height: 1.9; }
.hl-text span { border-radius: 6px; padding: 2px 4px; transition: background .2s; }
.hl-text span.on { background: var(--amber); }
.hl-text span .lt { font-size: 14px; font-weight: 700; color: var(--tealDark); margin-right: 4px; }

/* 提示詞框 */
.pbox-ui { border: 2px solid var(--teal); border-radius: var(--radius); overflow: hidden; background: var(--white); }
.pbox-ui .ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; background: var(--mint); flex-wrap: wrap; }
.pbox-ui .ph b { color: var(--tealDark); }
.pbox-ui pre { margin: 0; padding: 16px 18px; white-space: pre-wrap; font-family: inherit; font-size: 17px; line-height: 1.7; max-height: 360px; overflow: auto; }
.pbox-ui.long pre { max-height: 220px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 8px 16px; min-height: 44px; font-size: 16px; font-weight: 700; background: var(--teal); color: var(--white); }
.btn.ghost { background: var(--white); color: var(--tealDark); border: 1.5px solid var(--teal); }
.btn.dark { background: var(--navy); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.openers { padding: 10px 16px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.openers .lbl { color: var(--grey); font-size: 15px; margin-right: 4px; }

/* 填寫器 */
.privacy { background: var(--coralBg); border-left: 5px solid var(--coral); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: 16px; margin-bottom: 12px; }
.builder { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.field { margin-bottom: 12px; }
.field label { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 4px; }
.field .lt { width: 32px; height: 32px; border-radius: 8px; background: var(--navy); color: var(--mint2); display: grid; place-items: center; font-size: 17px; }
.field textarea, .scen input { width: 100%; font: inherit; font-size: 17px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 64px; }
.field textarea:focus, .scen input:focus { border-color: var(--teal); outline: none; }
.field .ex { font-size: 15px; color: var(--grey); margin-top: 2px; }
.field .ex button { border: 0; background: none; color: var(--tealDark); text-decoration: underline; font-size: 15px; padding: 0; }
.preview { position: sticky; top: 76px; align-self: start; }
.preview pre .empty { color: var(--grey2); }
.warn { color: var(--coral); font-size: 15px; font-weight: 700; min-height: 1.5em; }

/* 測驗 */
.quiz { display: grid; gap: 18px; }
.q { background: var(--off); border-radius: var(--radius); padding: 18px 20px; }
.q h3 { margin: 0 0 12px; font-size: 20px; line-height: 1.5; }
.q .opts { display: grid; gap: 8px; }
.q .opts button { text-align: left; border: 1.5px solid var(--line); background: var(--white); border-radius: 10px; padding: 10px 14px; min-height: 48px; font-size: 18px; }
.q .opts button:hover:not(:disabled) { border-color: var(--teal); }
.q .opts button.right { border-color: var(--teal); background: var(--mint); font-weight: 700; }
.q .opts button.wrong { border-color: var(--coral); background: var(--coralBg); }
.q .opts button:disabled { cursor: default; }
.q .exp { margin-top: 10px; font-size: 17px; }
.q .exp b.ok { color: var(--tealDark); }
.q .exp b.no { color: var(--coral); }
.score { font-weight: 700; color: var(--tealDark); font-size: 20px; }
.gate-msg { color: var(--grey); font-size: 16px; }

/* 勾選、評分、情境 */
.checks { background: var(--off); border-radius: var(--radius); padding: 14px 18px; }
.checks h3 { margin: 0 0 8px; font-size: 19px; color: var(--tealDark); }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.checks input { width: 22px; height: 22px; margin-top: 4px; accent-color: var(--teal); flex: none; }
.checks .done-msg { color: var(--tealDark); font-weight: 700; margin-top: 6px; }
.checks .gnote { color: var(--coral); font-weight: 700; font-size: 16px; margin-top: 4px; }
.fit-result { margin-top: 10px; font-size: 20px; font-weight: 700; color: var(--tealDark); }
.meter { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--teal); transition: width .3s; }
.scen .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-bottom: 10px; }
.scen .row label { font-size: 15px; color: var(--grey); display: block; }
.taskpair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.taskpair label { font-size: 15px; color: var(--grey); display: block; margin-bottom: 4px; }
.taskpair .hint, .taskpair .saved { grid-column: 1 / -1; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chips button { border: 1.5px solid var(--teal); background: var(--white); color: var(--tealDark); border-radius: 999px; padding: 4px 14px; min-height: 40px; font-size: 16px; }
.saved { color: var(--grey); font-size: 15px; }

/* 流程、跳轉、空泛版 */
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.flow div { flex: 1 1 110px; background: var(--off); border-radius: 10px; padding: 12px 8px; text-align: center; font-weight: 700; font-size: 17px; display: grid; place-items: center; }
.flow div.g { background: var(--tealDark); color: var(--white); }
.flow div.end { background: var(--navy); color: var(--white); }
.jump { display: grid; gap: 10px; }
.jump button { text-align: left; border: 1.5px solid var(--line); background: var(--white); border-radius: var(--radius); padding: 14px 18px; font-size: 19px; display: flex; gap: 14px; align-items: center; min-height: 60px; }
.jump button:hover { border-color: var(--teal); }
.jump button.seen { background: var(--mint); }
.vague { background: #EEF1F4; border-radius: var(--radius); padding: 18px 20px; }
.vague .lb { color: var(--grey); font-weight: 700; font-size: 16px; }
.vague p { font-size: 22px; font-weight: 700; margin: 6px 0; }
.pick { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pick button { width: 64px; height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--white); font-size: 22px; font-weight: 700; }
.pick button.on { background: var(--teal); border-color: var(--teal); color: var(--white); }
.locked-note { color: var(--grey); font-size: 16px; background: var(--off); border-radius: 10px; padding: 12px 16px; }
.fallback { border: 1.5px dashed var(--grey2); border-radius: var(--radius); padding: 14px 18px; }
.fallback h3 { margin: 0 0 4px; font-size: 18px; }
.drawer-link { border: 0; background: none; color: var(--tealDark); font-weight: 700; font-size: 17px; padding: 6px 0; text-decoration: underline; text-underline-offset: 4px; }
.drawer-link::before { content: '📖 '; }

/* 翻頁列 */
.pager { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); }
.pager button { border: 1.5px solid var(--teal); background: var(--white); color: var(--tealDark); border-radius: 12px; padding: 8px 20px; min-height: 48px; font-size: 17px; font-weight: 700; }
.pager button.primary { background: var(--teal); color: var(--white); }
.pager button:disabled { opacity: .4; cursor: not-allowed; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots button { width: 12px; height: 12px; min-height: 0; padding: 0; border-radius: 50%; border: 0; background: var(--line); }
.dots button.seen { background: var(--mint2); }
.dots button.on { background: var(--teal); transform: scale(1.3); }

/* 側頁 */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--white); z-index: 40; box-shadow: -8px 0 30px rgba(0,0,0,.18); transform: translateX(105%); transition: transform .3s; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--navy); color: var(--white); font-weight: 700; }
.drawer-head button { border: 1px solid var(--mint2); background: none; color: var(--white); border-radius: 999px; padding: 4px 14px; min-height: 40px; }
.drawer-body { padding: 18px 22px 40px; overflow: auto; font-size: 17px; }
.drawer-body h2 { font-size: 22px; color: var(--navy); border-bottom: 3px solid var(--teal); padding-bottom: 6px; }
.drawer-body h3 { font-size: 18px; color: var(--teal); margin-bottom: 4px; }
.drawer-body p { margin: 6px 0; }
.drawer-body .note { background: var(--coralBg); border-left: 4px solid var(--coral); padding: 8px 12px; border-radius: 6px; }
.drawer-body table { border-collapse: collapse; width: 100%; font-size: 16px; margin: 8px 0; }
.drawer-body th { background: var(--teal); color: var(--white); text-align: left; padding: 6px 8px; }
.drawer-body td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
.drawer-body .pbox-ui { margin: 10px 0; }
.scrim { position: fixed; inset: 0; background: rgba(11,18,32,.35); z-index: 35; display: none; }
.scrim.on { display: block; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--navy); color: var(--white); padding: 12px 20px; border-radius: 12px; font-weight: 700; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
.toast.on { opacity: 1; }

/* 我的成果 */
.mine h2 { font-size: 20px; color: var(--navy); }
.mine .item { background: var(--off); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; white-space: pre-wrap; }
.mine .item b { color: var(--tealDark); display: block; }

/* 投影模式 */
.present-code { display: none; }
body.present { --fs: 26px; }
body.present .stage { max-width: 1500px; }
body.present h1 { font-size: 48px; }
body.present .privacy, body.present .field .ex { display: none; }
body.present .present-code { display: block; position: fixed; right: 24px; bottom: 90px; z-index: 30; background: var(--navy); color: var(--white); font-size: 56px; font-weight: 700; padding: 6px 22px; border-radius: 16px; }
body.present .flip { height: 250px; }
body.present .rows > div { grid-template-columns: 56px 320px 1fr; }

/* 手機 */
@media (max-width: 760px) {
  :root { --fs: 17px; }
  .brand { display: none; }
  .top { padding: 8px 12px; gap: 8px; }
  .stage { padding: 20px 16px 40px; }
  h1 { font-size: 24px; }
  .two, .builder, .unlock-hero { grid-template-columns: 1fr; }
  .resource, .taskpair { grid-template-columns: 1fr; }
  .resource { gap: 10px; }
  .rows > div { grid-template-columns: 40px 1fr; }
  .rows > div span { grid-column: 2; }
  .steps { grid-template-columns: 1fr 1fr; }
  .scen .row { grid-template-columns: 1fr; }
  .preview { position: static; }
  .pager { padding: 8px 10px; }
  .pager button { padding: 8px 12px; }
  .dots { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .flip .in, .drawer, .meter i { transition: none; }
  .shake { animation: none; }
}

/* v1.1 */
.pnote { background: #FFF8E6; color: var(--ink); font-size: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.pick-msg { margin-top: 10px; font-weight: 700; color: var(--tealDark); min-height: 1.5em; }
.q .opts button:disabled { color: var(--ink); opacity: 1; }
.q .opts button:disabled:not(.right):not(.wrong) { color: var(--grey2); }
.hl-ask { font-weight: 700; font-size: 20px; color: var(--navy); margin-bottom: 10px; }
.hl-text.guess { display: grid; gap: 8px; }
.hl-s { text-align: left; border: 2px dashed var(--line); background: var(--white); border-radius: 10px; padding: 10px 14px; font-size: 19px; line-height: 1.7; }
.hl-s:hover { border-color: var(--teal); }
.hl-s .lt { display: none; }
.hl-s.found { border-style: solid; border-color: var(--teal); background: #FFF4D6; }
.hl-s.found .lt { display: inline-block; background: var(--teal); color: var(--white); border-radius: 6px; padding: 0 8px; margin-right: 8px; font-size: 15px; }
.task-in { width: 100%; font: inherit; font-size: 17px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 4px 0 10px; }
.redline .rl { color: var(--coral); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
body.present .q h3, body.present .q .opts button, body.present .pbox-ui pre, body.present .xcard > button, body.present .xcard .xbody,
body.present .rows b, body.present .rows span, body.present .checks label, body.present .hl-s, body.present .flow div, body.present .steps > div { font-size: 24px; }
body.present .field textarea { font-size: 22px; }

/* 視窗太矮時才讓圖縮小置中（此時寬度會小於欄寬，屬於降級情況） */
@media (max-height: 700px) {
  figure.slide { display: flex; justify-content: center; }
  figure.slide img { width: auto; max-height: calc(100vh - 56px - 72px - 70px); }
}
/* 投影模式：沒有側欄與進度條，讓投影片吃滿整個畫面 */
body.present .stage { max-width: 100%; padding-left: 16px; padding-right: 16px; }
body.present figure.slide { display: flex; justify-content: center; }
body.present figure.slide img { width: auto; max-height: calc(100vh - 56px - 72px - 56px); }

/* ── 翻頁按鈕移到畫面中間，夾著頁數 ── */
.pager { justify-content: center; gap: 18px; }
.pager .pos { min-width: 190px; text-align: center; }
@media (max-width: 760px) { .pager { gap: 10px; } .pager .pos { min-width: 0; } }
/* 捲軸一律佔位，翻到會捲動的頁時欄位不會左右跳動 */
html { scrollbar-gutter: stable; }

/* ── 投影片可選取文字層 ──
   透明文字疊在投影片圖上：畫面看起來完全一樣，但可以反白、複製、Ctrl+F 搜尋。
   位置與字級都是百分比／cqw，所以圖放大縮小時文字會跟著貼合。 */
figure.slide { position: relative; container-type: inline-size; }
.slide-txt { position: absolute; inset: 0; pointer-events: none; }
.slide-txt span {
  position: absolute; white-space: pre; line-height: 1.25;
  color: transparent; pointer-events: auto; cursor: text;
  -webkit-user-select: text; user-select: text;
}
.slide-txt span::selection { background: rgba(14,155,138,.35); }

/* ── 嵌入看板（Padlet 作品展牆，WEB-24）── */
.emb { display: grid; gap: 10px; }
.emb-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.emb-fr { width: 100%; height: 58vh; min-height: 380px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); display: block; }
.emb-fb { font-size: 15px; color: var(--grey); }
@media (max-width: 760px) { .emb-fr { height: 66vh; min-height: 320px; } }

/* ── 帶走包（WEB-23）── */
.mine-sec { margin-bottom: 18px; }
.mine-sec h3 { font-size: 17px; color: var(--tealDark); border-bottom: 2px solid var(--mint2); padding-bottom: 4px; margin: 0 0 10px; }
.mine .item .when { color: var(--tealDark); font-weight: 700; }
.mine .muted { color: var(--grey); }
.mine .fl { display: block; margin-bottom: 10px; }
.mine .fl b { display: block; font-size: 15px; color: var(--navy); margin-bottom: 4px; }
.mine .fl input { width: 100%; font: inherit; font-size: 15px; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.mine .fl input:focus { border-color: var(--teal); outline: none; }
.mine-act { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }

/* ── 三份方法來源三卡並排（WEB-13，照簡報 P37）── */
.srcs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.srcc { display: flex; flex-direction: column; gap: 6px; background: var(--off); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; }
.srcc.main { background: var(--mint); border-color: var(--teal); }
.srcc-sh { display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--white); aspect-ratio: 16 / 9; }
.srcc-sh img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.srcc-tag { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--white); background: var(--navy); border-radius: 999px; padding: 2px 10px; }
.srcc-tag.main { background: var(--tealDark); }
.srcc-t { font-size: 16px; font-weight: 700; color: var(--navy); text-decoration: none; line-height: 1.4; }
.srcc-t:hover { text-decoration: underline; }
.srcc-l { margin: 0; font-size: 15px; line-height: 1.6; }
.srcc-u { font-size: 13px; color: var(--grey); word-break: break-all; margin-top: auto; }
.srcc .btn { min-height: 36px; padding: 5px 10px; font-size: 14px; }
@media (max-width: 900px) { .srcs { grid-template-columns: 1fr; } .srcc-sh { aspect-ratio: 21 / 9; } }

/* ── 指引概覽頁（WEB-02）── */
.gv { display: grid; gap: 12px; }
.gv-two { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 16px; align-items: start; }
.gv-col h3 { margin: 0 0 8px; font-size: 17px; color: var(--tealDark); }
.gv-doc, .gv-map { width: 100%; display: block; border: 1px solid var(--line); border-radius: 10px; background: var(--white); cursor: zoom-in; }
.gv-doc { max-height: 300px; object-fit: cover; object-position: top center; }
.gv-map { padding: 6px; }
.gv-meta { font-size: 14px; color: var(--grey); margin-top: 6px; line-height: 1.6; }
.gv-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.gv-full { border: 2px solid var(--teal); border-radius: 12px; overflow: hidden; }
.gv-fr { width: 100%; height: 62vh; min-height: 380px; border: 0; display: block; }
.gv-url { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--off); border-radius: 10px; padding: 8px 12px; }
.gv-url code { font-size: 13px; color: var(--navy); word-break: break-all; }
@media (max-width: 900px) { .gv-two { grid-template-columns: 1fr; } .gv-doc { max-height: 220px; } }

/* ── 頂部兩顆按鈕（KT 2026-09-21）── */
.top-acts { display: flex; gap: 8px; align-items: center; }
@media (max-width: 760px) { .top-acts { gap: 6px; } .top-acts .mine-btn { padding: 4px 10px; font-size: 14px; } }

/* ── 我的技能卡抽屜 ── */
.kc { background: var(--off); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
.kc > b { color: var(--navy); font-size: 17px; display: block; }
.kc-tag { color: var(--tealDark); font-weight: 700; margin: 2px 0 8px; }
.kc-pw { display: grid; grid-template-columns: 72px auto; gap: 6px 0; align-items: start; }
.kc-pw .btn { justify-self: start; min-height: 32px; padding: 3px 10px; font-size: 14px; }
.kc-p { grid-column: 1 / -1; margin: 4px 0 0; padding: 10px 12px; background: var(--white); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; font-size: 14px; line-height: 1.7; }
.kc-r { margin-bottom: 5px; line-height: 1.7; }
.kc-r > span { display: inline-block; min-width: 72px; color: var(--tealDark); font-weight: 700; }

/* ── 2-5 系統提示詞就地展開 ── */
.sp h3 { margin: 0 0 6px; font-size: 18px; color: var(--tealDark); }
.sp-in { margin: 0 0 10px; font-size: 15px; line-height: 1.7; }
.sp-box { margin-top: 10px; border: 2px solid var(--teal); border-radius: 12px; overflow: hidden; }
.sp-pre { margin: 0; padding: 12px 14px; max-height: 46vh; overflow: auto; white-space: pre-wrap; font-size: 14px; line-height: 1.7; background: var(--white); }

/* ── 投影片下方的三欄複製鈕與連結列（4-6）── */
.strow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.strow .btn { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; min-height: 52px; }
.strow .btn b { font-size: 16px; }
.strow .btn span { font-size: 13px; opacity: .85; }
.lkrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; justify-content: center; }
@media (max-width: 760px) { .strow { grid-template-columns: 1fr; } }

/* 投影片下方有按鈕列時，圖要讓出空間，否則會被浮動的翻頁鈕蓋住 */
.stage.has-rows figure.slide img { max-height: calc(100vh - 56px - 72px - 128px - 132px); }
.stage.has-rows { padding-bottom: 92px; }

/* ── 投影片下方的三步按鈕列（2-7 隨堂練習，KT 2026-09-22）── */
.steprow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.stepc { background: var(--off); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 10px; }
.stepc-h { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--navy); font-size: 15px; margin-bottom: 8px; }
.stepc-n { width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: var(--mint2); display: grid; place-items: center; font-size: 13px; }
.stepc-b { display: flex; flex-wrap: wrap; gap: 8px; }
.stepc-b .btn { min-height: 38px; padding: 6px 12px; font-size: 15px; }
@media (max-width: 900px) { .steprow { grid-template-columns: 1fr; } }

.stage.has-steps figure.slide img { max-height: calc(100vh - 56px - 72px - 128px - 232px); }
.stage.has-steps { padding-bottom: 96px; }

.kc-note { margin-top: 6px; font-size: 14px; color: var(--coral); font-weight: 700; }
</style>
</head>

<script>window.DATA={"prompts": {"A": {"title": "附錄 A　文件格式萃取與複用助手（完整系統提示詞）", "text": "# 文件格式萃取與複用助手\n\n你是一位熟悉行政文書、工作文件分析與內容查核的「文件格式萃取與複用助手」。\n\n你的任務是協助使用者完成兩件事：\n\n1. 從一份已經完成的成品文件中，萃取可重複使用的格式。\n2. 將萃取出的格式套用到新的素材，產生同類型的新文件。\n\n這兩個階段必須分開執行。\n\n完成第一階段後，不得自動進入第二階段。只有當使用者明確要求「套用模板」，並提供新素材後，才可以進入第二階段。\n\n\n# 一、首次互動的開場引導\n\n當使用者第一次開啟 Gem，或尚未提供明確任務時，請使用以下開場方式：\n\n你好，我可以協助你把一份已完成的工作文件，轉換成可以重複使用的模板。\n\n你可以使用以下兩種功能：\n\n1. 萃取格式\n請提供一份已經填寫完成的文件，我會分析它的結構、欄位與寫作規則，整理成可重複使用的模板。\n\n2. 套用模板\n如果你已經有一份模板，可以再提供新的會議內容、逐字稿、工作資料或其他素材，我會先檢查資料是否足夠，再協助你產生一份新文件。\n\n建議先從「萃取格式」開始。\n\n請上傳一份已經完成的文件，並告訴我：\n「請幫我萃取這份文件的格式。」\n\n開場說明應保持簡短清楚，不要一次向使用者說明所有內部規則。\n\n\n# 二、模式判斷\n\n請根據使用者的指令判斷目前要執行的模式。\n\n## 模式一：萃取格式\n\n當使用者：\n\n- 上傳一份已完成的文件\n- 說「萃取格式」\n- 說「把這份文件做成模板」\n- 說「分析這份文件的格式」\n- 或提出意思相近的要求\n\n請執行「第一階段：萃取格式」。\n\n## 模式二：套用模板\n\n當使用者：\n\n- 明確說「套用模板」\n- 要求用既有格式產生一份新文件\n- 同時提供模板與新的原始素材\n- 或提出意思相近的要求\n\n請執行「第二階段：套用模板」。\n\n## 無法判斷時\n\n如果無法判斷使用者要萃取格式還是套用模板，請只問：\n\n請問你現在想要：\n\n1. 從成品文件中萃取格式\n2. 把既有模板套用到新的素材\n\n請選擇其中一項，我再繼續協助你。\n\n不要自行選擇模式。\n\n\n# 三、第一階段：萃取格式\n\n## 第一階段的任務\n\n當使用者提供一份已完成的文件時，請分析這份文件背後可重複使用的：\n\n- 文件結構\n- 標題層級\n- 固定欄位\n- 替換欄位\n- 選填欄位\n- 表格結構\n- 各段落的功能\n- 寫作語氣\n- 內容詳細程度\n- 完成文件前需要準備的資料\n\n這個階段的任務是「萃取格式」，不是摘要、改寫或重新產出文件內容。\n\n\n## 第一階段的重要規則\n\n1. 必須以使用者提供的成品文件為主要依據。\n2. 不要把文件中的特定人名、日期、地點、事件、數字或議題當成固定格式。\n3. 不要把單次會議的決議或內容誤認為每次都要保留的固定文字。\n4. 不要自行增加原文件不存在的欄位。\n5. 不要在這個階段產生新的工作文件。\n6. 不要只把原文件清空，必須進一步說明各欄位的功能與使用規則。\n7. 如果某項規則只能從單一文件推測，請標示：\n   「可能的格式規則，建議人工確認。」\n8. 如果使用者提供的是空白表格，而不是已完成的成品，請主動提醒：\n   「這是一份空白表格，可以辨識欄位，但不足以完整判斷各欄位實際的寫作方式。若要準確萃取模板，建議再提供一份已填寫完成的文件。」\n9. 若文件涉及醫療、護理、個資或其他敏感內容，提醒使用者確認資料已完成適當的去識別化處理。\n10. 不要因為文件中有空白欄位，就自行判斷該欄位是選填、不適用或應刪除。\n\n\n## 第一階段的輸出格式\n\n請依照以下順序輸出：\n\n### 一、文件名稱與用途\n\n說明：\n\n- 這是什麼類型的文件\n- 通常在什麼情境下使用\n- 主要目的是什麼\n\n如果用途無法從文件中確認，請清楚標示需要使用者確認。\n\n\n### 二、文件結構地圖\n\n依照原文件的實際順序，列出：\n\n- 文件標題\n- 基本資料\n- 主要章節\n- 次要章節\n- 固定欄位\n- 表格欄位\n- 結尾資訊\n- 附件或簽核區\n\n必須保留原文件的層級與順序。\n\n\n### 三、欄位分類\n\n將辨識出的內容分成以下三類：\n\n#### 固定結構\n\n每次使用時通常會保留的：\n\n- 標題\n- 章節\n- 欄位名稱\n- 表格欄名\n- 文件順序\n\n#### 每次替換的內容\n\n每次製作新文件時，需要依新素材更新的內容。\n\n#### 視情況使用的內容\n\n只有特定情況才會出現的段落或欄位。\n\n如果無法確定某個欄位是否為選填，請標示：\n\n「是否選填需要使用者確認。」\n\n\n### 四、各段落的寫作規則\n\n針對每個主要段落說明：\n\n- 這一段要放什麼內容\n- 要回答什麼問題\n- 使用什麼語氣\n- 大約需要多詳細\n- 是否需要條列\n- 是否需要保留正式用語\n- 是否涉及裁示、決議、責任或簽核\n- 容易出錯的地方\n\n\n### 五、可重複使用的文件模板\n\n依照原文件的結構，建立一份可直接複製的模板。\n\n需要替換的內容統一使用以下形式：\n\n［欄位名稱］\n\n例如：\n\n時間：［會議日期與時間］\n地點：［會議地點］\n主席：［主席姓名與職銜］\n\n模板中只能保留：\n\n- 固定結構\n- 固定欄位名稱\n- 必要的寫作提示\n\n不得保留原文件中特定的人名、事件、日期、數字或個案內容。\n\n\n### 六、使用模板前需要準備的資料\n\n列出使用者下一次套用模板時，需要提供哪些資料。\n\n例如：\n\n- 日期與時間\n- 地點\n- 參與人員\n- 原始逐字稿\n- 會議議程\n- 發言內容\n- 決議內容\n- 負責單位\n- 執行期限\n\n請依實際文件類型調整，不要直接套用上述範例。\n\n\n### 七、格式檢查清單\n\n列出完成新文件後需要人工確認的項目，包括：\n\n- 結構是否完整\n- 欄位是否遺漏\n- 人名與職稱是否正確\n- 日期與數字是否正確\n- 發言、建議、裁示與決議是否清楚區分\n- 是否含有不應公開的個人資料\n- 是否需要主管、承辦人或專業人員複核\n\n\n# 四、第一階段完成後的引導\n\n完成格式萃取後，請在回覆最後加入以下提醒：\n\n格式已經萃取完成。\n\n接下來你可以：\n\n1. 先檢查這份模板是否符合你實際工作的使用方式\n2. 告訴我需要修改、增加或刪除哪些欄位\n3. 提供一份新的原始素材，請我將內容套用到這份模板\n\n如果你要繼續，請提供新的素材並告訴我：\n「請將這份素材套用到剛才的模板。」\n\n進入套用階段後，我會先檢查新素材是否足以完成模板。若資料不足、文件性質不同，或有內容無法判斷，我會先向你提問，不會自行補寫。\n\n\n# 五、第二階段：套用模板\n\n## 第二階段的啟動條件\n\n只有當使用者明確要求「套用模板」，並提供新的原始素材後，才能進入第二階段。\n\n不要因為第一階段已經完成，就自行接續產生新文件。\n\n\n## 第二階段的第一個動作：資料適用性檢查\n\n產出文件前，必須先比對模板與新素材。\n\n請檢查：\n\n1. 新素材與原模板是否屬於相同或相近的文件類型\n2. 模板需要哪些必要資料\n3. 新素材已經提供哪些資料\n4. 哪些重要資料仍然缺少\n5. 哪些模板欄位不適用於新素材\n6. 哪些內容可能需要推測才能填寫\n7. 新素材中是否清楚區分發言、建議、回覆、裁示與正式決議\n8. 是否含有需要去識別化的個人資料或敏感資訊\n\n\n# 六、必須先提問的情況\n\n遇到以下任一情況時，不得直接產出完整文件：\n\n- 無法確認文件日期或時間\n- 無法確認文件地點\n- 無法確認主持人、主席、紀錄人或相關人員\n- 無法確認人物姓名或職銜\n- 無法判斷內容是發言、建議、回覆、裁示或正式決議\n- 新素材缺少模板中的關鍵資料\n- 新素材的文件性質與模板不同\n- 原模板中的部分欄位不適用於新素材\n- 必須依靠推測才能完成內容\n- 來源資料彼此矛盾\n- 不確定某個欄位應保留、刪除、留白或標示不適用\n- 新素材只包含部分內容，無法代表完整事件或完整會議\n\n遇到上述情況時，請先輸出「產出前確認」。\n\n\n# 七、產出前確認\n\n請使用以下格式：\n\n## 產出前確認\n\n### 目前可以確認的資料\n\n列出新素材中可以直接確認的資訊。\n\n### 缺少的關鍵資料\n\n列出模板需要、但新素材沒有提供的資訊。\n\n### 模板與新素材不一致的地方\n\n說明：\n\n- 哪些欄位不適用\n- 哪些段落需要調整\n- 原模板與新素材的文件性質有何不同\n\n### 需要你確認的問題\n\n一次最多提出五個最關鍵的問題。\n\n問題必須具體且容易回答。\n\n例如：\n\n1. 這份文件的正式日期為何？\n2. 影片中的主持人是否等同正式會議主席？\n3. 公聽會沒有正式裁示時，你希望保留欄位並標示不適用，還是刪除該欄位？\n4. 這次要整理整場內容，還是只整理指定的時間範圍？\n5. 發言人的姓名與職銜是否已有正式名單可供核對？\n\n提出問題後必須停止，等待使用者回答。\n\n在使用者回答以前，不得產出完整文件。\n\n\n# 八、第二階段的產出規則\n\n收到使用者補充或選擇後，才能產出文件。\n\n產出時必須遵守以下規則：\n\n1. 只使用使用者提供，或新素材中可以直接確認的資訊。\n2. 不得為了填滿模板而推測、腦補或合理化缺少的內容。\n3. 不得使用影片發布日期推測活動或會議日期。\n4. 不得根據畫面、稱呼或一般背景知識，自行判斷人物姓名、身分與職銜。\n5. 不得把主持人自動視為正式主席。\n6. 不得把發言、建議、期待、倡議或討論內容改寫成主席裁示。\n7. 不得把個人主張或團體訴求改寫成正式決議。\n8. 不得自行產生主管機關回覆、行政承諾、執行方式、改善時程或列管結果。\n9. 未經使用者確認，不得自行填寫「無」「略」「洽悉」「解除列管」或其他具有正式文件意義的文字。\n10. 未經使用者確認，不得自行刪除、留白或標示不適用。\n11. 若使用者提供的資料只涵蓋部分內容，必須標示本文件的資料範圍。\n12. 如果來源互相矛盾，必須再次請使用者決定，不可自行選擇。\n13. 涉及醫療、護理或其他專業內容時，必須提醒由專業人員複核。\n\n\n# 九、資料不足時的處理選項\n\n如果使用者無法補充缺少的資料，請詢問使用者希望如何處理各缺漏欄位：\n\n1. 保留欄位並標示「待確認」\n2. 標示「不適用」\n3. 刪除該欄位\n4. 暫不產出，等資料補齊後再繼續\n\n不得替使用者選擇。\n\n\n# 十、使用者要求先產出草稿時\n\n如果使用者明確表示：\n\n「請先依現有資料產出，缺少內容標示待確認。」\n\n你可以繼續製作草稿。\n\n但仍須遵守：\n\n- 不得自行推測\n- 不得補寫來源中沒有的內容\n- 不得把發言轉換成裁示或決議\n- 不得把影片發布時間當成事件日期\n- 必須清楚標示資料範圍\n- 必須在文件後列出待確認資訊\n\n\n# 十一、第二階段的輸出格式\n\n資料確認完成後，請依序輸出：\n\n## 一、使用的模板\n\n簡要說明這次套用的文件格式。\n\n## 二、資料範圍\n\n說明這次使用的素材範圍。\n\n如果是影片，應標示：\n\n- 影片名稱\n- 使用的開始時間\n- 使用的結束時間\n\n如果無法確認時間，必須向使用者提問，不得自行選擇。\n\n## 三、完成的新文件\n\n依照確認後的模板產出完整文件。\n\n## 四、仍待確認的資訊\n\n只列出經使用者同意保留為「待確認」的項目。\n\n## 五、調整或刪除的模板欄位\n\n說明哪些欄位因文件性質不同而調整、標示不適用或刪除。\n\n## 六、人工查核提醒\n\n列出需要人工回看、比對或專業複核的內容。\n\n\n# 十二、整體語言與互動原則\n\n1. 使用繁體中文。\n2. 語氣清楚、專業、容易理解。\n3. 一次只完成使用者目前指定的階段。\n4. 不要一次提供過多理論說明。\n5. 問題應具體、簡短且容易回答。\n6. 不要假裝知道來源沒有提供的資訊。\n7. 正確與可查核性優先於文件完整度。\n8. 寧可先詢問，也不要自行補寫。\n9. 使用者未授權前，不得自行做出文件結構上的重大修改。\n10. 所有正式文件都應保留人工確認與最終審核。"}, "3-A": {"title": "提示詞 3-A　課程設定卡範例", "text": "這是我的【課程設定卡】，請直接用它往下做，不必再訪談我。\n\n【課程設定卡】\n課程名稱：護理人員如何安全且正確地使用 AI\n對象與起點：全院護理同仁（含新進與資深）。多數人用過 ChatGPT 或 Gemini 寫過文字，但沒有看過衛福部的指引，也不確定哪些資料可以放進去。\n要解決的工作問題：同仁已經在用 AI 處理行政文書，但沒有一致的判斷標準；資料外洩與內容錯誤的風險目前由個人承擔。\n形式與時數：實體在職教育，60 分鐘，30–40 人；講述約 40 分鐘，討論與演練約 20 分鐘。\n學習目標：\n① 學員能夠說出三類不可輸入 AI 的資料，並在自己的工作情境舉出一個例子。\n② 學員能夠用四個問題檢查 AI 的產出，判斷能不能進流程。\n③ 學員能夠指出自己單位裡一件適合、一件不適合交給 AI 的工作。\n驗收方式：課堂情境判斷三題，加上每人寫下一件要帶回單位試用的工作。\n待確認事項：院內是否已有核准的 AI 工具清單；本課是否併入年度資安教育時數。"}, "3-B": {"title": "提示詞 3-B　課程大綱範例", "text": "這是我確認過的課程大綱，請直接用它往下做簡報，不必重新規劃。\n\n【課程大綱】護理人員如何安全且正確地使用 AI（60 分鐘）\n\n一、開場：AI 幫了忙，也闖了禍（8 分鐘）\n　對應目標：① 暖身\n　這段教什麼：兩個真實情境——AI 幫忙寫好衛教稿、AI 把不存在的數字寫進報告。\n　教法：舉手投票＋提問「這樣可以嗎？」\n　學員要做什麼：對兩個情境各舉手表態一次。\n　怎麼確認學員聽懂了：看投票分布是否出現分歧，作為後面討論的切入點。\n\n二、三條底線：能幫忙，不等於能負責（12 分鐘）\n　對應目標：①②\n　這段教什麼：衛福部指引的三條底線，以及「協助」與「負責」的分界。\n　教法：講述＋指引原文對照。\n　學員要做什麼：對照講義，在三條底線旁各寫一個自己科別的例子。\n　怎麼確認學員聽懂了：隨機口頭提問兩位，請他們說出自己寫的例子。\n\n三、哪些資料不能放進 AI（15 分鐘）\n　對應目標：①\n　這段教什麼：輸入前要確認的三件事——工具、資料、用途。\n　教法：小組討論（4–5 人一組）。\n　學員要做什麼：每組列出三筆自己科別最容易誤放進 AI 的資料。\n　怎麼確認學員聽懂了：各組口頭回報一筆，講師當場判斷可／不可並說明理由。\n\n四、AI 給了答案，怎麼檢查（15 分鐘）\n　對應目標：②\n　這段教什麼：產出後的四個檢查問題——來源、內容、適用性、責任。\n　教法：演練。\n　學員要做什麼：拿到一份 AI 寫的衛教稿（內含兩處錯誤），用四個問題找出問題。\n　怎麼確認學員聽懂了：統計找出兩處錯誤的人數，並請一位說明是用哪一個問題抓到的。\n\n五、帶回單位：一件要試、一件不要試（10 分鐘）\n　對應目標：③\n　這段教什麼：把判斷標準收斂成一個可以馬上用的決定。\n　教法：個人書寫＋兩人分享。\n　學員要做什麼：寫下一件下週就要交給 AI 的工作，和一件確定不交的工作。\n　怎麼確認學員聽懂了：收回書寫單，抽三張念出來確認理由站得住腳。\n\n分鐘數加總：8＋12＋15＋15＋10 ＝ 60 分鐘，等於課程總時數。\n\n【最弱的三點與修改建議】\n1. 第三段小組討論 15 分鐘，30–40 人可能收不回來——建議限定每組只回報一筆，並先指定回報順序。\n2. 第四段的演練素材需要事先準備一份「含兩處錯誤的 AI 衛教稿」，尚未製作。\n3. 目標③的驗收只收書寫單，無法確認學員回單位後是否真的執行——建議加一次課後兩週的簡短追蹤。"}, "1-1": {"title": "提示詞 1-1　PTCF 空白模板", "text": "P　你是一位［產業或單位］的［職位或身分］。\nT　請［撰寫／總結／改寫］一份［要完成的內容］。\nC　這份內容要給［對象］，情境是［情境］。請根據［參考資料或文件］，不要加入資料裡沒有的內容。\nF　請用［列點／表格／段落］呈現，使用繁體中文。"}, "範例": {"title": "範例", "text": "P　你是一位熟悉護理教育、醫療政策與生成式 AI 應用的教學設計顧問。\nT　閱讀衛福部指引，挑選護理主管與護理人員最需要理解的內容，規劃成三頁教學簡報。\nC　用於私醫護協會 AI 課程第一單元；對象不具資訊治理背景；講解約五分鐘。重要主張只依 Notebook 來源。\nF　繁體中文，輸出三頁簡報規劃；每頁包含標題、一句核心觀念、最多三項教學重點及對應來源。"}, "2-1": {"title": "提示詞 2-1　萃取格式（上傳成品文件後）", "text": "請幫我萃取這份文件的格式。"}, "2-2": {"title": "提示詞 2-2　套用模板（上傳新素材後）", "text": "請將這份素材套用到剛才的模板。"}, "3-1": {"title": "提示詞 3-1　訪談：產出課程設定卡", "text": "你是一位資深教學設計顧問，熟悉在職教育與 ADDIE。請用訪談的方式帶我完成 A（分析），最後產出一張「課程設定卡」；這個階段不要產出課綱或簡報。\n現在就開始訪談，直接問我第一個問題，不要先摘要來源。最多五個主問題、5 分鐘內問完；一次只問一題，每題附 2–3 個建議答案讓我挑；我答得太籠統時，同一題最多追問一次，之後記成「待確認」往下走；可以先用來源檔名猜答案，用「我猜是……對嗎？」讓我確認。這些問題的答案由我提供，不必從來源尋找。\n五題依序問：① 這堂課要教給誰？他們最卡在哪？② 要教什麼主題？手上有哪些素材？③ 形式與人數？④ 總共多少時間？其中多少留給動手？⑤ 學完要能做出或判斷什麼？\n問完後輸出【課程設定卡】：課程名稱、對象與起點、要解決的工作問題、形式與時數、學習目標（學員能夠＋動詞＋具體成果）、驗收方式、待確認事項。輸出後問我哪一項要改；我說確認之後就停下來，不要自動往下做課綱。"}, "3-2": {"title": "提示詞 3-2　課程大綱", "text": "請讀取來源中的 ADDIE 方法論文章，以及我剛才確認的【課程設定卡】。用文章的方法帶我完成 D：設計，產出一份課程大綱。\n請先用來源文章的做法，整理出這堂課需要處理的知識點、案例與練習，再把它們分成合理的教學段落。一次只做一個步驟，做完停下來等我確認。\n課綱每一段都要寫出：段落名稱／對應的學習目標／這段要教什麼／用什麼教法／學員要做什麼／分鐘數／怎麼確認學員聽懂了。\n分鐘數加總必須等於課程總時數。來源不足或和設定卡衝突的地方，先問我，不要自行補寫。全部段落完成後，列出最弱的三點與修改建議，等我決定。"}, "3-3": {"title": "提示詞 3-3　簡報內容", "text": "請依照剛才確認的課綱，產出這堂課的簡報內容，包含簡報骨架與每一頁內文，一次完整輸出。\n頁數請先依課程時數建議。\n每一頁請輸出：頁碼／這頁的教學任務／對應課綱段落與學習目標／標題／核心觀念一句／最多三個重點（每個 20 字以內）。\n沒有我說「開始生成簡報」之前，不要用 Studio 產生簡報檔。"}, "4-1": {"title": "提示詞 4-1　技能卡 1：寫文案", "text": "P　你是一位擅長資訊圖像化的設計師。\nT　請把［主題］的衛教資料，用白話改寫成一份［尺寸］的文案。\nC　這份文宣要給［對象］看，他們現在最困擾的是［困擾］，希望他們看完能［行動］。請根據我提供的資料，或是幫我搜尋官方的資料，並附上來源網址。\nF　版面是［尺寸］，文字量要放得下；使用繁體中文。"}, "4-2": {"title": "提示詞 4-2　技能卡 2：萃取風格（上傳參考圖後）", "text": "請把這張圖的視覺風格描述成可重複使用的提示詞：配色、插圖風格、字體感、留白與構圖。不要描述圖的內容。"}, "4-2A": {"title": "提示詞 4-2A　可愛風視覺", "text": "請用這個視覺風格製作：\n淺薄荷綠與水藍色為底，留白要多。\n標題放在圓角對話框裡，用深藍色粗體字。\n內容分成幾個橫向區塊，區塊之間用細線隔開。\n插圖用日系圓潤手繪風，人物線條簡單、表情溫和，動作與食物用小圖示表現。\n重點詞放在圓角色塊裡反白。\n整體乾淨明亮，像社區衛生單位發的衛教單張。\n\n畫面上的文字一律用繁體中文。\n主標題最多 10 個字，每個重點最多 8 個字，不要寫長句說明。\n開始生圖前，先把你要放進圖裡的文字列出來給我確認。"}, "4-2B": {"title": "提示詞 4-2B　親和感視覺", "text": "請用這個視覺風格製作：\n米黃色暖底，標題用橘、紅、綠三色搭配。\n標題做成有厚描邊的手寫感藝術字，旁邊點綴彩虹、星星、小鳥這類手繪塗鴉。\n主視覺放一張真人照片，四角圓角、加白色外框。\n比較多的資訊用表格整理：表頭深色，欄位用淺色交錯底。\n角落放一個小吉祥物。\n整體活潑親切，像發給家長看的宣導單。\n\n畫面上的文字一律用繁體中文。\n主標題最多 10 個字，每個重點最多 8 個字，不要寫長句說明。\n開始生圖前，先把你要放進圖裡的文字列出來給我確認。"}, "4-2C": {"title": "提示詞 4-2C　專業醫療感視覺", "text": "請用這個視覺風格製作：\n深酒紅、深青綠與白色三色為主，不留白邊，色塊直接滿版。\n每一區用整條色帶當標題列，白色置中粗體字。\n內容排成等寬的色塊網格，每格一個小標題加兩三行說明。\n插圖用扁平向量人物，造型簡潔、膚色多元。\n字體簡潔無裝飾，行距放寬。\n整體像醫學會或政府機構出版的專業文件。\n\n畫面上的文字一律用繁體中文。\n主標題最多 10 個字，每個重點最多 8 個字，不要寫長句說明。\n開始生圖前，先把你要放進圖裡的文字列出來給我確認。"}, "4-3": {"title": "提示詞 4-3　生成衛教文宣（在同一個對話，做完 4-1、4-2 之後）", "text": "請用上面這段文案和風格描述，生成［尺寸］的衛教文宣。文字使用繁體中文，完整照文案呈現，不要增減內容；重點資訊要清楚易讀，不要被裝飾蓋掉。"}}, "sections": {"0.1": "<h2>0.1　課前準備</h2>\n<p class=\"li\">1. 使用 <strong>Google 個人帳號</strong>登入（公司或學校帳號可能被停用 AI 功能）。</p>\n<p class=\"li\">2. 先開啟兩個工具，確認可以使用：</p>\n<p class=\"li\">• Gemini：gemini.google.com</p>\n<p class=\"li\">• Gemini Notebook：在 Gemini 左側欄開啟，或至 notebooklm.google.com</p>\n<p class=\"li\">3. 確認電腦可以上傳檔案（PDF、Word、圖片）。</p>", "0.2": "<h2>0.2　資料紅線</h2>\n<h3>這些資料，不進 AI</h3>\n<p class=\"li\">• 病人姓名、病歷號、床號</p>\n<p class=\"li\">• 可辨識的同仁資料</p>\n<p class=\"li\">• 未公開的院內資訊</p>\n<p class=\"li\">• 不在院內核准清單的工具</p>\n<h3>這些產出，先過人的檢查</h3>\n<p class=\"ck\">☐ 來源回得去嗎？</p>\n<p class=\"ck\">☐ 內容有沒有補寫？</p>\n<p class=\"ck\">☐ 適合現在這個情境嗎？</p>\n<p class=\"ck\">☐ 由誰簽名負責？</p>\n<p class=\"note\">出處：衛生福利部《醫療機構應用生成式人工智慧指引》（115 年 5 月 29 日函頒）</p>", "0.3": "<h2>0.3　四張技能卡</h2>\n<table><tr><th>技能卡</th><th>一句話</th><th>什麼時候用</th><th>使用單元</th></tr><tr><td>01　PTCF 溝通框架</td><td>四格填好，AI 一次就懂你要什麼！</td><td>你明明交代了，AI 給的還是差一點，要來回改好幾輪。</td><td>單元一、單元四</td></tr><tr><td>02　範例萃取法</td><td>給 AI 一份好範本，下一份直接照做！</td><td>你手上有一份做得很好的文件，希望以後每一份都長這樣。</td><td>單元二、單元四</td></tr><tr><td>03　AI 訪談釐清法</td><td>怕漏東西？讓 AI 一題一題問你！</td><td>你很清楚要做什麼，但要交代的細節太多，漏掉一項就整個做偏。</td><td>單元三</td></tr><tr><td>04　AI 隨身教練</td><td>網路上的好範例，AI 照著方法帶你做！</td><td>專家公開分享一套有效的流程，你想完整學起來，用在自己的工作上。</td><td>單元三</td></tr></table>", "1.1": "<h2>1.1　PTCF 四要素</h2>\n<table><tr><th>要素</th><th>說明</th></tr><tr><td>P　角色 Persona</td><td>設定 AI 應扮演的角色、職位或身分。例如：你是一位［產業］的專案經理。</td></tr><tr><td>T　任務 Task</td><td>明確指出你希望 AI 執行的具體工作。<strong>這是提示詞中最重要的部分</strong>，請務必包含明確的動詞或指令（例如：撰寫、總結、改變語氣等）。</td></tr><tr><td>C　背景 Context</td><td>提供相關的背景細節、參考資料或情境，讓 AI 根據這些資訊生成內容。例如：根據［相關專案文件的細節］。</td></tr><tr><td>F　格式 Format</td><td>指定輸出的形式或呈現方式。例如：「限制使用列點方式呈現」或「整理成表格格式」。</td></tr></table>", "1.2": "<h2>1.2　PTCF 空白模板</h2>\n<div class=\"pbox\" data-pid=\"1-1\"></div>\n<h3>範例：同一個任務的完整版</h3>\n<div class=\"pbox\" data-pid=\"範例\"></div>", "1.3": "<h2>1.3　衛福部指引：使用前後的三道檢查</h2>\n<h3>輸入前：資料能不能交給 AI</h3>\n<table><tr><th>檢查</th><th>問自己</th></tr><tr><td>工具</td><td>符合院內規範嗎？資料如何處理與保存？個人帳號可關閉 Gemini 活動紀錄。</td></tr><tr><td>資料</td><td>含病歷、影像、語音、可識別個資或未公開院內資料嗎？能否改用模擬資料？</td></tr><tr><td>用途</td><td>輸入這些資料真的必要嗎？符合原本授權目的嗎？出現異常時如何停止與通報？</td></tr></table>\n<h3>輸出後：結果能不能使用</h3>\n<p class=\"ck\">☐ 來源：AI 說的重點，找得到出處嗎？出處可靠、完整、沒有過期嗎？</p>\n<p class=\"ck\">☐ 內容：有沒有「看起來合理、其實是錯的」地方？例如編出來的數字（幻覺）、前後矛盾，或寫了來源沒有的東西。</p>\n<p class=\"ck\">☐ 適用性：就算內容正確，也要想一想：適合這位病人、我們單位的流程和現在的情境嗎？</p>\n<p class=\"ck\">☐ 責任與透明：最後由誰確認、誰負責？如果是 AI 直接回覆民眾，有沒有先告訴對方這是 AI、可能會出錯？</p>\n<h3>與民眾互動或錄音錄影</h3>\n<p class=\"li\">• AI 直接與民眾互動時，主動揭露由 AI 系統運作，並提醒輸出可能出現錯誤。</p>\n<p class=\"li\">• 錄音錄影前說明必要性與用途限制；病人或家屬明確拒絕時，應停止錄製。</p>\n<p class=\"li\">• 錄音、錄影及相關資料，只能用於原先告知的目的範圍。</p>", "1.4": "<h2>1.4　參考資料</h2>\n<p class=\"li\">• 衛生福利部《醫療機構應用生成式人工智慧指引》PDF（素材資料夾）</p>\n<p class=\"li\">• PTCF 出處：Google Workspace《Gemini 提示詞指南》（數位時代整理）<a href=\"https://www.bnext.com.tw/article/89977/efficient-google-workspace-ai-prompt-tips\" target=\"_blank\" rel=\"noopener\">https://www.bnext.com.tw/article/89977/efficient-google-workspace-ai-prompt-tips</a></p>", "2.1": "<h2>2.1　步驟</h2>\n<p class=\"li\">1. 開啟「文件格式萃取與複用助手」Gem。</p>\n<p class=\"li\">2. 上傳一份<strong>已填寫完成</strong>的文件，貼上提示詞 2-1。</p>\n<p class=\"li\">3. 用 <strong>Gate 1</strong> 檢查模板。</p>\n<p class=\"li\">4. 上傳新素材，貼上提示詞 2-2。</p>\n<p class=\"li\">5. 用 <strong>Gate 2</strong> 檢查新文件。</p>", "2.2": "<h2>2.2　Gem 連結</h2>\n<p><strong>文件格式萃取與複用助手</strong></p>\n<p><a href=\"https://gemini.google.com/gem/1RlUR_YuQcmudtIpTeX5Hv6JNuWLcCCK_?usp=sharing\" target=\"_blank\" rel=\"noopener\">https://gemini.google.com/gem/1RlUR_YuQcmudtIpTeX5Hv6JNuWLcCCK_?usp=sharing</a></p>\n<p class=\"note\">打不開 Gem 時：把「附錄 A」整段貼進 Gemini 新對話，再上傳文件，流程相同。貼到 ChatGPT 或 Claude 也可以使用。</p>", "2.3": "<h2>2.3　提示詞</h2>\n<div class=\"pbox\" data-pid=\"2-1\"></div>\n<div class=\"pbox\" data-pid=\"2-2\"></div>\n<p>新素材是影片時，可以加一句指定範圍，例如：「請只使用影片 14:30–25:00 這一段。」</p>", "2.4": "<h2>2.4　檢查清單</h2>\n<h3>Gate 1　萃取完成後：模板抓得準不準？</h3>\n<p class=\"ck\">☐ 結構完整：章節與順序跟原文件一致</p>\n<p class=\"ck\">☐ 分得清楚：固定的、每次要換的，有分開</p>\n<p class=\"ck\">☐ 沒有夾帶：這一次的具體內容沒有留在模板裡</p>\n<h3>Gate 2　套用完成後：新文件寫得有沒有依據？</h3>\n<p class=\"ck\">☐ 有來源：內容都來自新素材</p>\n<p class=\"ck\">☐ 不補寫：資料不足時先問，不自己編</p>\n<p class=\"ck\">☐ 人把關：個資、專業內容與簽核由人確認</p>", "2.5": "<h2>2.5　卡住怎麼辦</h2>\n<p class=\"li\">• 影片讀不進去：改用素材資料夾的逐字稿。</p>\n<p class=\"li\">• Gem 打不開：使用附錄 A 的完整系統提示詞。</p>", "2.6": "<h2>2.6　回單位可以試的文件</h2>\n<p>跨科協調聯絡單、公文回覆、公告通知、教育訓練紀錄、交班紀錄。使用前先去識別化。</p>", "2.7": "<h2>2.7　課堂素材</h2>\n<table><tr><th>素材</th><th>說明</th></tr><tr><td>範本</td><td>疾管署性別平等工作小組會議紀錄（精簡版）PDF，素材資料夾</td></tr><tr><td>新素材</td><td>改善護理人員權益公聽會影片，使用 14:30–25:00：<a href=\"https://www.youtube.com/watch?v=XQRrkNJoMao\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=XQRrkNJoMao</a></td></tr></table>", "3.1": "<h2>3.1　步驟</h2>\n<p class=\"li\">1. 在 Gemini Notebook 放入來源：你要教的教材（先去識別化）＋ ADDIE 主方法文，需要時再加兩篇補強文（網址見 3.5）。</p>\n<p class=\"li\">2. 貼上提示詞 3-1，回答 AI 的訪談問題。</p>\n<p class=\"li\">3. 確認課程設定卡 → <strong>存成筆記 → 把筆記轉成來源</strong>（下一步才讀得到）。</p>\n<p class=\"li\">4. 貼上提示詞 3-2，產出課綱，用五項檢查確認。</p>\n<p class=\"li\">5. 貼上提示詞 3-3，產出簡報內容。</p>", "3.2": "<h2>3.2　提示詞</h2>\n<div class=\"pbox\" data-pid=\"3-1\"></div>\n<div class=\"pbox\" data-pid=\"3-2\"></div>\n<div class=\"pbox\" data-pid=\"3-3\"></div>", "3.3": "<h2>3.3　課綱五項檢查</h2>\n<p class=\"ck\">☐ 目標別太大：目標能不能在這個時數內達成</p>\n<p class=\"ck\">☐ 段落分得對：知識點有沒有被分成合理的教學段落</p>\n<p class=\"ck\">☐ 每段有教法：問答、討論、演練、影片，不能整堂都是講述</p>\n<p class=\"ck\">☐ 時間加得起來：分鐘數加總等於總時數</p>\n<p class=\"ck\">☐ 內容有依據：重要主張回得到來源；醫療與法規內容，正式使用前請院內專業人員複核</p>", "3.4": "<h2>3.4　卡住怎麼辦</h2>\n<p class=\"li\">• Notebook 不照做，或提示詞貼不進去：改到 Gemini 主站，從左側欄開啟同一本 Notebook，再貼一次。</p>\n<p class=\"li\">• AI 一次問好幾題：回覆「只問第一題」。</p>\n<p class=\"li\">• 輸出被截斷：回覆「每 5 頁分一批，繼續」。</p>", "3.5": "<h2>3.5　參考資料</h2>\n<p class=\"li\">• 主方法文　ADDIE model：<a href=\"https://teaching-and-learning-collection.sites.uu.nl/toolbox/addie-model/\" target=\"_blank\" rel=\"noopener\">https://teaching-and-learning-collection.sites.uu.nl/toolbox/addie-model/</a></p>\n<p class=\"li\">• 分析補強　Analysis: Planning Your Instruction：<a href=\"https://ecampus.uconn.edu/analysis/\" target=\"_blank\" rel=\"noopener\">https://ecampus.uconn.edu/analysis/</a></p>\n<p class=\"li\">• 課綱補強　Design: Using a Course Design Plan：<a href=\"https://ecampus.uconn.edu/design/\" target=\"_blank\" rel=\"noopener\">https://ecampus.uconn.edu/design/</a></p>\n<p class=\"li\">• 勞動部 TTQS〈以 ADDIE 模式探討訓練需求獲得之方法〉PDF（素材資料夾）</p>", "4.1": "<h2>4.1　步驟</h2>\n<p class=\"li\">1. 想一個宣導主題，選一種尺寸（三折頁、海報、A4 DM），再回答三個問題：</p>\n<p class=\"li\">• 對象：這份文宣給誰看？</p>\n<p class=\"li\">• 困擾：他們現在最困擾什麼？</p>\n<p class=\"li\">• 行動：看完希望他做什麼？</p>\n<p class=\"li\">2. <strong>技能卡 1　寫文案</strong>：把答案填進提示詞 4-1 的［ ］，貼到 Gemini 送出。有衛教資料就一起上傳或貼上；沒有的話，AI 會搜尋官方資料並附上來源網址，記得點開確認。</p>\n<p class=\"li\">3. <strong>技能卡 2　挑風格</strong>：三種做法挑一種——直接複製提示詞 4-2A／4-2B／4-2C 其中一種現成風格；或到 Google 圖片搜尋「衛教文宣」，存一張喜歡的圖上傳後貼提示詞 4-2；或到 Banana X 風格圖鑑挑一個。</p>\n<p class=\"li\">4. <strong>生成文宣</strong>：在同一個 Gemini 對話裡，貼上提示詞 4-3。</p>\n<p class=\"li\">5. 用內容檢查與視覺檢查確認。</p>", "4.2": "<h2>4.2　提示詞</h2>\n<div class=\"pbox\" data-pid=\"4-1\"></div>\n<p>［尺寸］選一種：三折頁（A4 橫式，正反兩面共六欄）、海報（直式，A3 以上）、A4 DM（A4 直式單張）。</p>\n<div class=\"pbox\" data-pid=\"4-2\"></div>\n<p>不想上傳圖，也可以直接複製下面三段現成的風格描述，挑一種貼進同一個對話。</p>\n<div class=\"pbox\" data-pid=\"4-2A\"></div>\n<div class=\"pbox\" data-pid=\"4-2B\"></div>\n<div class=\"pbox\" data-pid=\"4-2C\"></div>\n<p class=\"note\">生圖模型畫中文字不穩：字少還可以，寫成句子就容易糊掉或寫錯。</p>\n<p class=\"note\">所以三段都要求「文字用繁體中文、標題 10 字內、重點 8 字內」，並且<strong>先看文字再生圖</strong>。</p>\n<p class=\"note\">生出來一定要自己讀過一遍，錯字與醫療用詞由你負責確認。</p>\n<div class=\"pbox\" data-pid=\"4-3\"></div>", "4.3": "<h2>4.3　風格範本與樣板庫</h2>\n<table><tr><th>風格</th><th>範本</th></tr><tr><td>可愛風</td><td>臺北市社區營養推廣中心〈養肌出擊 肌少遠離〉</td></tr><tr><td>親和感</td><td>臺北市政府衛生局〈定期檢查小眼睛 保護眼睛亮晶晶〉</td></tr><tr><td>專業醫療感</td><td>Obesity Association〈Trauma-Informed Obesity Care〉</td></tr></table>\n<p class=\"li\">• <strong>Google 圖片搜尋「衛教文宣」</strong>：<a href=\"https://www.google.com/search?q=衛教文宣&amp;udm=2\" target=\"_blank\" rel=\"noopener\">https://www.google.com/search?q=衛教文宣&amp;udm=2</a>　找一張喜歡的圖，存下來上傳給 Gemini，再貼提示詞 4-2。</p>\n<p class=\"li\">• <strong>Banana X 風格圖鑑</strong>：<a href=\"https://furoku.github.io/bananaX/projects/infographic-evaluation/zh/#designs\" target=\"_blank\" rel=\"noopener\">https://furoku.github.io/bananaX/projects/infographic-evaluation/zh/#designs</a>　挑一個風格，複製它的提示詞，當作步驟 3 的風格描述貼給 Gemini。</p>\n<p class=\"li\">• <strong>BananaNL 擴充功能</strong>：Chrome 擴充功能，在 Gemini Notebook 做資訊圖表時一鍵套用風格。於 Chrome 線上應用程式商店搜尋「BananaNL」。</p>\n<p class=\"note\">使用前先確認院內資安規範；不輸入病人個資或院內機密。</p>", "4.4": "<h2>4.4　檢查清單</h2>\n<h3>內容檢查</h3>\n<p class=\"ck\">☐ 資訊正確：數字、資格、時程、建議與警語都能回到原始資料或官方來源網址</p>\n<p class=\"ck\">☐ 內容完整：適用對象、必要條件、例外與行動方式沒有遺漏</p>\n<p class=\"ck\">☐ 目標達成：讀者看完能抓到重點，也知道下一步要做什麼</p>\n<p class=\"ck\">☐ 用語恰當：專業名詞有說明，不誇大風險，也不提供個別診療建議</p>\n<h3>視覺檢查</h3>\n<p class=\"ck\">☐ 中文正確：沒有錯字、亂碼或簡體字，專有名詞與單位寫法一致</p>\n<p class=\"ck\">☐ 閱讀順序：讀者一眼知道先看哪裡，再看哪裡</p>\n<p class=\"ck\">☐ 關聯清楚：標題、圖像、箭頭與文字相互對應，沒有造成錯誤因果</p>\n<p class=\"ck\">☐ 畫面易讀：字級、對比與留白足夠，重要訊息不會被裝飾搶走</p>\n<p class=\"ck\">☐ 重點保留：視覺化後沒有刪掉關鍵數字、條件、警語或資料來源</p>\n<p class=\"note\">圖卡仍是草稿；通過內容與視覺檢查，才能正式使用。</p>", "A": "<h2>附錄 A　文件格式萃取與複用助手</h2>\n<p>完整系統提示詞。Gem 打不開時，整段貼進 Gemini 新對話，送出後再上傳文件。</p>\n<div class=\"pbox\" data-pid=\"A\"></div>"}, "checklists": {"這些產出，先過人的檢查": ["來源回得去嗎？", "內容有沒有補寫？", "適合現在這個情境嗎？", "由誰簽名負責？"], "輸出後：結果能不能使用": ["來源：AI 說的重點，找得到出處嗎？出處可靠、完整、沒有過期嗎？", "內容：有沒有「看起來合理、其實是錯的」地方？例如編出來的數字（幻覺）、前後矛盾，或寫了來源沒有的東西。", "適用性：就算內容正確，也要想一想：適合這位病人、我們單位的流程和現在的情境嗎？", "責任與透明：最後由誰確認、誰負責？如果是 AI 直接回覆民眾，有沒有先告訴對方這是 AI、可能會出錯？"], "Gate 1　萃取完成後：模板抓得準不準？": ["結構完整：章節與順序跟原文件一致", "分得清楚：固定的、每次要換的，有分開", "沒有夾帶：這一次的具體內容沒有留在模板裡"], "Gate 2　套用完成後：新文件寫得有沒有依據？": ["有來源：內容都來自新素材", "不補寫：資料不足時先問，不自己編", "人把關：個資、專業內容與簽核由人確認"], "3.3": ["目標別太大：目標能不能在這個時數內達成", "段落分得對：知識點有沒有被分成合理的教學段落", "每段有教法：問答、討論、演練、影片，不能整堂都是講述", "時間加得起來：分鐘數加總等於總時數", "內容有依據：重要主張回得到來源；醫療與法規內容，正式使用前請院內專業人員複核"], "內容檢查": ["資訊正確：數字、資格、時程、建議與警語都能回到原始資料或官方來源網址", "內容完整：適用對象、必要條件、例外與行動方式沒有遺漏", "目標達成：讀者看完能抓到重點，也知道下一步要做什麼", "用語恰當：專業名詞有說明，不誇大風險，也不提供個別診療建議"], "視覺檢查": ["中文正確：沒有錯字、亂碼或簡體字，專有名詞與單位寫法一致", "閱讀順序：讀者一眼知道先看哪裡，再看哪裡", "關聯清楚：標題、圖像、箭頭與文字相互對應，沒有造成錯誤因果", "畫面易讀：字級、對比與留白足夠，重要訊息不會被裝飾搶走", "重點保留：視覺化後沒有刪掉關鍵數字、條件、警語或資料來源"]}, "cards": {"1": {"n": "01", "name": "PTCF 溝通框架", "tag": "四格填好，AI 一次就懂你要什麼！", "when": "你明明交代了，AI 給的還是差一點，要來回改好幾輪。", "how": "送出前先把四格填好：要它當誰、做什麼、給誰看、輸出成什麼樣子。", "prompt": "P　你是一位{角色}。\nT　請{動詞}一份{要完成的內容}。\nC　這份給{對象}看，用在{情境}。請依{我提供的資料}，不要自行補充。\nF　{列點或段落}，約 {300} 字，繁體中文。\n\n最後請告訴我：還缺哪些資訊，會讓結果更準？", "unlock": "不用再找別人的提示詞，你自己寫的最貼近你的工作。"}, "2": {"n": "02", "name": "範例萃取法", "tag": "給 AI 一份好範本，下一份直接照做！", "when": "你手上有一份做得很好的文件，希望以後每一份都長這樣。", "how": "上傳範本，請 AI 拆成模板；你確認模板沒問題，再放新資料進去套。", "prompt": "① 這是一份做好的{文件類型}範例。\n請拆出可以重複使用的模板：固定結構與標題／每次要換的欄位／寫作規則（詳略、稱謂、數字與日期格式）／完成後的檢查清單。\n先不要套用新資料。", "prompt2": "② 模板我確認過了。請把{新素材}套進這個模板。\n資料不足的地方標「待補」，不要自行編造。", "unlock": "重複性文件不用每次重寫，格式、用語、規矩都跟你的範本一致。"}, "3": {"n": "03", "name": "AI 訪談釐清法", "tag": "怕漏東西？讓 AI 一題一題問你！", "when": "你很清楚要做什麼，但要交代的細節太多，漏掉一項就整個做偏。", "how": "請 AI 反過來訪問你，一次一題、附選項讓你挑，問完整理成一張卡給你確認。", "prompt": "我要做{一件事}。請用訪談的方式，幫我把細節補齊。\n\n規則：一次只問一題，每題給我 2–3 個選項讓我挑，最多 {5} 題。\n我答得太籠統時，同一題最多追問一次，之後記成「待確認」往下走。\n\n問完後整理成一份{設定卡}給我確認，先不要開始做。\n過程中你如果缺少什麼資訊，直接提出來向我確認。", "unlock": "不用怕漏講條件，該問的 AI 會替你問完。"}, "4": {"n": "04", "name": "AI 隨身教練", "tag": "網路上的好範例，AI 照著方法帶你做！", "when": "專家公開分享一套有效的流程，你想完整學起來，用在自己的工作上。", "how": "上傳資料，讓 AI 當你的隨身教練，依照來源的步驟，一步步帶你完成任務。", "prompt": "來源是我上傳的{文章／影片／講義}。\n請你當我的教練，照著來源的方法，帶我完成{我的目標}。\n\n開始前先做兩件事：\n1. 列出這個方法需要的前置條件（工具、帳號、檔案、軟硬體），逐項問我有沒有。\n2. 我的情況是{我的條件}，請告訴我哪幾步需要調整。\n\n然後一次只帶一步，我回報做完了再繼續。\n不要直接給摘要，也不要跳步。", "unlock": "看到好方法不用自己摸索，AI 照著那份資料，帶你做出成果。"}}, "files": {"00_備料間/單元二_格式萃取與模板生成_教學素材/講師示範_Demo/疾管署_性別平等工作小組113年第2次會議紀錄_精簡範例.pdf": {"name": "疾管署_性別平等工作小組113年第2次會議紀錄_精簡範例.pdf", "url": "files/疾管署_性別平等工作小組113年第2次會議紀錄_精簡範例.pdf"}, "00_備料間/衛福部_醫療機構應用生成式人工智慧指引_20260529.pdf": {"name": "衛福部_醫療機構應用生成式人工智慧指引_20260529.pdf", "url": "files/衛福部_醫療機構應用生成式人工智慧指引_20260529.pdf"}, "07_教學資源與素材/互動網頁/assets/來源預覽1_ADDIE.jpg": {"name": "來源預覽1_ADDIE.jpg", "url": "files/來源預覽1_ADDIE.jpg"}, "07_教學資源與素材/互動網頁/assets/來源預覽2_Analysis.jpg": {"name": "來源預覽2_Analysis.jpg", "url": "files/來源預覽2_Analysis.jpg"}, "07_教學資源與素材/互動網頁/assets/來源預覽3_Design.jpg": {"name": "來源預覽3_Design.jpg", "url": "files/來源預覽3_Design.jpg"}, "07_教學資源與素材/互動網 <script>(function () {
  const D = window.DATA, C = window.CONTENT, SEG = C.segments;
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach((k) => k != null && e.append(k.nodeType ? k : document.createTextNode(k)));
    return e;
  };

  // ── 本機儲存（失敗時照常運作）──
  const KEY = 'kt-ai-workshop-0929';
  let S = {};
  try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const get = (k, d) => (k in S ? S[k] : d);
  const set = (k, v) => { S[k] = v; save(); };

  const present = /[?&]mode=present/.test(location.search);
  if (present) document.body.classList.add('present');

  // ── 小工具 ──
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
  const touch = matchMedia('(pointer: coarse)').matches;
  // 同步複製：在使用者手勢當下就寫進剪貼簿，不經過 await，所以不會因為
  // 之後開新分頁搶走焦點而失敗。clipboard API 被擋時，這條路通常還活著。
  function copySync(text) {
    try {
      const ta = el('textarea', { style: 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0', readonly: '' });
      ta.value = text; document.body.append(ta);
      ta.focus(); ta.select(); if (ta.setSelectionRange) ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy'); ta.remove();
      return ok;
    } catch (e) { return false; }
  }
  // 兩條路都走：先同步、再用 clipboard API 覆蓋一次。只要有一條成功就算成功。
  async function copy(text, pre, extra) {
    let ok = copySync(text);
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
    if (ok) { toast(extra || (touch ? '已複製！到 AI 對話框長按「貼上」' : '已複製！到 AI 對話框按 Ctrl＋V（Mac 按 ⌘＋V）貼上')); return true; }
    if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('無法自動複製：文字已選取，請按 Ctrl＋C（Mac 按 ⌘＋C）');
    return false;
  }
  function openTool(id, text, fixed) {
    const t = C.tools[id];
    let url = t.url;
    if (t.q && fixed && text && text.length < 1800) url += '?q=' + encodeURIComponent(text);
    window.open(url, '_blank', 'noopener');
  }
  function openerBtns(text, tools, fixed, preRef, extra) {
    const mk = (id, cls) => el('button', { class: 'btn ' + cls, type: 'button', onclick: async () => { const t = typeof text === 'function' ? text() : text; if (text) { if (!t) { toast('先填至少一格'); return; } const ok = await copy(t, preRef && preRef(), extra && extra()); if (!ok) { toast('沒複製成功，文字已幫你選取：請按 Ctrl＋C（Mac 按 ⌘＋C）後再按一次'); return; } } openTool(id, t, fixed); } }, (text ? '複製並開啟 ' : '開啟 ') + C.tools[id].name);
    const [first, ...rest] = tools;
    return [mk(first, ''), rest.length ? el('details', { class: 'more-ai' }, el('summary', {}, '用其他 AI'), el('div', { class: 'btns' }, rest.map((id) => mk(id, 'ghost')))) : null];
  }
  const fileBtn = (rel, label, cls) => D.files && D.files[rel] ? el('a', { class: cls, href: D.files[rel].url, download: D.files[rel].name }, label) : el('span', { class: 'hint' }, '（檔案待補）');
  const privacy = () => el('div', { class: 'privacy', role: 'note' }, '⚠️ 請勿輸入病人姓名、病歷號、床號、可辨識的同仁資料或未公開的院內資訊。');


  // 投影片文字層：疊在圖上、看不見，但可以反白、複製、Ctrl+F 搜尋。
  // 座標與字級在建置時從 PDF 換算成百分比，所以跟著圖一起縮放。
  function slideText(n) {
    const lines = (D.slideText || {})[String(n)];
    if (!lines || !lines.length) return null;
    return el('div', { class: 'slide-txt', 'aria-hidden': 'true' },
      lines.map(([x, y, w, fs, txt]) => el('span', {
        style: `left:${x}%;top:${y}%;width:${w}%;font-size:${fs}cqw`,
      }, txt)));
  }

  function promptBox(pid, title, opt = {}) {
    const p = D.prompts[pid]; if (!p) return el('div', { class: 'wip' }, `找不到提示詞 ${pid}`);
    const pre = el('pre', {}, p.text);
    const long = p.text.length > 1500;
    return el('div', { class: 'pbox-ui' + (long ? ' long' : '') },
      el('div', { class: 'ph' }, el('b', {}, title || p.title), opt.noCopy ? null : el('button', { class: 'btn', type: 'button', onclick: () => copy(p.text, pre) }, '📋 複製')),
      opt.note ? el('div', { class: 'pnote' }, '👉 ' + opt.note) : null,
      pre,
      opt.copyOnly ? null : el('div', { class: 'openers' }, ...openerBtns(p.text, ['gemini', 'chatgpt', 'claude'], !long && pid !== 'A', () => pre)));
  }

  // ── 側頁 ──
  function openDrawer(sec, label) {
    const body = $('#drawerBody'); body.innerHTML = D.sections[sec] || '<p>找不到這段講義。</p>';
    body.querySelectorAll('.pbox').forEach((n) => n.replaceWith(promptBox(n.dataset.pid)));

  $('#drawerClose').onclick = closeDrawer; $('#scrim').onclick = closeDrawer;

  // ── 我的技能卡（KT 2026-09-21：只留技能卡，B/C/D 三區移除）──
  // 內容直接讀 D.cards（真源在 簡報建置腳本_v4/part1.js 的 CARDS），
  // 技能卡改版 v2 定稿後這裡不必再改，換掉 CARDS 就會跟著動。
  // 五點（KT 2026-09-21）：一句／情境／操作／關鍵提示詞／痛點。
  // `prompt` 欄位要等技能卡 v2 定稿後加進 CARDS；還沒有的時候這一列自動不出現。
  const CARDF = [['一句', 'tag'], ['情境', 'when'], ['操作', 'how'], ['痛點', 'unlock']];

  function cardsPage() { // 四張卡的單頁 HTML，瀏覽器直接列印或另存 PDF
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const body = Object.keys(D.cards).map((k) => { const c = D.cards[k];
      return `<div class="c"><b>技能卡 ${esc(c.n)}　${esc(c.name)}</b>`
        + CARDF.map(([lab, key]) => c[key] ? `<div class="r"><span>${esc(lab)}</span>${esc(c[key])}</div>` : '').join('')
        + [c.prompt, c.prompt2].filter(Boolean).map((t, i, a) =>
            `<div class="r"><span>關鍵提示詞${a.length > 1 ? ' ' + '①②'[i] : ''}</span></div><pre>${esc(t)}</pre>`).join('')

      const toggle = el('button', { class: 'btn ghost', type: 'button', onclick: () => {
        box.hidden = !box.hidden;
        toggle.textContent = box.hidden ? '📖 展開系統提示詞' : '▾ 收合系統提示詞';
      } }, '▾ 收合系統提示詞');
      return el('div', { class: 'sp' },
        el('h3', {}, b.title),
        b.intro ? el('p', { class: 'sp-in' }, b.intro) : null,
        el('div', { class: 'btns' },
          el('button', { class: 'btn', type: 'button', onclick: () => copy(text, pre, '已複製完整系統提示詞！貼進新對話送出，再上傳文件') }, '📋 複製提示詞'),
          b.gem ? el('button', { class: 'btn dark', type: 'button', onclick: () => openTool(b.gem) }, '👉 點我進入 Gem') : null,
          toggle),
        box);
    },
    links: (b) => el('div', { class: 'btns' }, b.items.map((x) => el('a', { class: 'btn ghost', href: x[1], target: '_blank', rel: 'noopener' }, x[0]))),
    // 嵌入外部看板（Padlet）。醫院／協會網路常擋第三方 iframe，
    // 所以「在新分頁開啟」是永遠看得到的備援，不是 iframe 失敗才出現。
    embed: (b) => {
      const frame = el('iframe', { class: 'emb-fr', src: b.src, title: b.title || '嵌入內容', loading: 'lazy', allow: 'clipboard-write' });
      const fb = el('div', { class: 'emb-fb' }, '如果這一塊是空白的，代表院內網路擋掉了嵌入畫面——請按上面那顆按鈕，在新分頁開啟。');
      return el('div', { class: 'emb' },
        el('div', { class: 'emb-bar' },
          el('a', { class: 'btn', href: b.open, target: '_blank', rel: 'noopener' }, b.label || '在新分頁開啟 ↗'),
          b.note ? el('span', { class: 'hint' }, b.note) : null),
        frame, fb);
    },
    takeaway: (b) => el('div', { class: 'takeaway' }, el('h3', {}, '這個單元，你帶走的三件事'), b.items.map((x, i) => el('div', {}, el('b', {}, `${String(i + 1).padStart(2, '0')}　${x[0]}`), el('span', {}, x[1])))),
  };

  function checks(key, title, items, note) {
    const v = get(key, []);
    const done = el('div', { class: 'done-msg' });
    const upd = () => { done.textContent = items.length && items.every((_, i) => v[i]) ? '全部檢查完成 ✓' : ''; };
    const box = el('div', { class: 'checks' }, title ? el('h3', {}, title) : null, items.map((t, i) => {
      const cb = el('input', { type: 'checkbox' }); cb.checked = !!v[i];
      cb.onchange = () => { v[i] = cb.checked; set(key, v); upd(); };
      return el('label', {}, cb, el('span', {}, t));
    }), note ? el('div', { class: 'gnote' }, note) : null, done);
    upd(); return box;
  }

  // ── 測驗 ──
  function quiz(seg, onChange, extra) { // extra = [節點, 標題]，接在選擇題後面當最後一題
    const ans = get('quiz:' + seg.id, {});
    const score = el('div', { class: 'score' });
    const upd = () => {
      const n = seg.quiz.filter((q) => q in ans).length, r = seg.quiz.filter((q) => ans[q] === C.quiz[q].a).length;
      score.textContent = seg.optionalQuiz
        ? (n < seg.quiz.length ? `已作答 ${n} / ${seg.quiz.length}。這是隨堂確認，可直接往下。` : r === seg.quiz.length ? `全對！${r} / ${seg.quiz.length} 題。` : `答對 ${r} / ${seg.quiz.length} 題。看一下解說，再往下。`)
        : (n < seg.quiz.length ? `已作答 ${n} / ${seg.quiz.length} 題。想直接往下也可以。` : r === seg.quiz.length ? `全對！${r} / ${seg.quiz.length} 題。` : `答對 ${r} / ${seg.quiz.length} 題。答錯的看一下解說。`);
      onChange(seg.optionalQuiz || n === seg.quiz.length);
    };
    const qs = seg.quiz.map((qid, qi) => {
      const Q = C.quiz[qid]; const exp = el('div', { class: 'exp', 'aria-live': 'polite' });
      const opts = el('div', { class: 'opts' });
      const mark = (pick) => {
        opts.querySelectorAll('button').forEach((b, i) => { b.disabled = true; if (i === Q.a) b.classList.add('right'); if (i === pick && pick !== Q.a) b.classList.add('wrong'); });
        exp.innerHTML = ''; exp.append(el('b', { class: pick === Q.a ? 'ok' : 'no' }, pick === Q.a ? '答對了！' : `正確答案是 ${'ABCD'[Q.a]}。`), ' ' + Q.e);
      };
      Q.o.forEach((o, i) => opts.append(el('button', { type: 'button', onclick: () => { ans[qid] = i; set('quiz:' + seg.id, ans); mark(i); upd(); } }, `${'ABCD'[i]}. ${o}`)));
      if (qid in ans) mark(ans[qid]);
      return el('div', { class: 'q' }, Q.ctx ? el('pre', { class: 'qctx' }, Q.ctx) : null, el('h3', {}, `第 ${qi + 1} 題　${Q.q}`), opts, exp);
    });
    const retry = el('button', { class: 'btn ghost', type: 'button', onclick: () => { set('quiz:' + seg.id, {}); render(); } }, '重新作答');
    let cur = Math.max(0, seg.quiz.findIndex((q) => !(q in ans)));
    const prevQ = el('button', { class: 'btn ghost', type: 'button' }, '‹ 上一題'), nextQ = el('button', { class: 'btn', type: 'button' }, '下一題 ›');
    const stepper = el('div', { class: 'qstep' });
    const steps = extra ? qs.concat([el('div', { class: 'qextra' }, el('h3', {}, extra[1]), extra[0])]) : qs;
    const show = () => {
      steps.forEach((q, i) => { q.hidden = i !== cur; });
      stepper.innerHTML = ''; steps.forEach((_, i) => {
        const q = seg.quiz[i];
        stepper.append(el('span', { class: (i === cur ? 'on ' : '') + (q && q in ans ? (ans[q] === C.quiz[q].a ? 'ok' : 'no') : '') }, String(i + 1)));
      });
      prevQ.disabled = cur === 0; nextQ.disabled = cur === steps.length - 1 || (!!seg.quiz[cur] && !(seg.quiz[cur] in ans));
    };
    prevQ.onclick = () => { cur--; show(); }; nextQ.onclick = () => { cur++; show(); };
    qs.forEach((q) => q.addEventListener('click', () => setTimeout(show, 0)));
    const w = el('div', { class: 'quiz' }, stepper, steps, el('div', { class: 'btns' }, prevQ, nextQ, score, retry));
    show(); upd(); return w;
  }

  // ── 導覽 ──
  let idx = 0;
  const ICON = { 填寫: '✏️', 思考: '❓', 測驗: '🎯', 動手: '🛠️', 點開: '👆', 解鎖: '🔓', 複製: '📋' };
  function iconOf(s) {
    if (s.quiz) return ['測驗', ICON.測驗];
    if (s.unlock) return ['解鎖', ICON.解鎖];
    const t = (s.blocks || []).map((b) => b.type + (b.task ? '+task' : ''));
    if (t.some((x) => /^(builder|scenario|score\+task|taskpair|cardplan)/.test(x))) return ['填寫', ICON.填寫];
    if (t.some((x) => /^(think|pick|highlight|topics)/.test(x))) return ['思考', ICON.思考];
    if (t.some((x) => /^(prompt|download|openers|checklist|gates|cardgo|chosen|urls|standby)/.test(x))) return ['動手', ICON.動手];
    if (t.some((x) => /^(flip|cards|expand)/.test(x))) return ['點開', ICON.點開];
    if ((s.actions || []).some((a) => a.copy)) return ['複製', ICON.複製];
    return null;
  }
  // 段落碼：單元-頁序（與側欄編號一致）。講師靠它報進度（「現在到三之六」）。
  // 插頁會整批位移 → 改動頁數後要重跑手冊 Part D 的對照表指令。
  SEG.forEach((s) => { s.n = SEG.filter((x) => x.unit === s.unit).indexOf(s) + 1; s.code = `${s.unit}-${s.n}`; });
  function unitDone(u) { const ss = SEG.filter((s) => s.unit === u); return ss.length && ss.every((s) => get('seen:' + s.id)); }
  function renderNav() {
    const nav = $('#units'); nav.innerHTML = '';
    C.units.forEach((u) => nav.append(el('button', { type: 'button', class: (SEG[idx].unit === u.id ? 'on' : '') + (unitDone(u.id) ? ' done' : ''), onclick: () => go(SEG.findIndex((s) => s.unit === u.id)) }, u.label)));
    const cur = SEG[idx], unit = C.units.find((u) => u.id === cur.unit), list = SEG.filter((s) => s.unit === cur.unit);
    const side = $('#side'); side.innerHTML = '';
    side.append(el('div', { class: 'side-h' }, unit.label === unit.title ? unit.label : `${unit.label}｜${unit.title}`));
    list.forEach((s) => { const ic = iconOf(s); side.append(el('button', { type: 'button', title: s.title, class: 'side-i' + (s === cur ? ' on' : '') + (get('seen:' + s.id) ? ' seen' : ''), onclick: () => { side.classList.remove('open'); go(SEG.indexOf(s)); } },
      el('span', { class: 'no' }, String(s.n)), el('span', { class: 'tt' }, (C.nav && C.nav[s.id]) || s.title), ic ? el('span', { class: 'ic', title: ic[0], 'aria-label': ic[0] }, ic[1]) : null)); });
    side.append(el('div', { class: 'legend' }, Object.entries(ICON).map(([k, v]) => el('span', {}, v + ' ' + k))));
    const on = side.querySelector('.side-i.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    $('#count').textContent = `${cur.n} / ${list.length}`;
    $('#bar').style.width = (cur.n / list.length * 100) + '%';
    $('#pos').textContent = `${unit.label}　第 ${cur.n} 頁／共 ${list.length} 頁`;
    $('#prev').disabled = idx === 0;
    $('#next').disabled = idx === SEG.length - 1;
  }
  function render() {
    const seg = SEG[idx]; const st = $('#stage'); st.innerHTML = '';
    const unit = C.units.find((u) => u.id === seg.unit);
    st.classList.toggle('is-slide', !!seg.slide && !seg.blocks && !seg.quiz);
    const ul = seg.unlock ? [].concat(seg.unlock) : [];
    ul.forEach((n) => set('unlock:' + n, true));
    if (seg.slide && !seg.blocks && !seg.quiz) {
      const acts = (seg.actions || []).map((a) => {
        if (a.copy) return el('button', { class: 'btn', type: 'button', onclick: () => copy(D.prompts[a.copy].text) }, '📋 ' + (a.label || '複製提示詞 ' + a.copy));
        if (a.open) return el('button', { class: 'btn ' + (a.open === 'gem' ? 'dark' : 'ghost'), type: 'button', onclick: () => openTool(a.open) }, '開啟 ' + C.tools[a.open].name);
        if (a.link) return el('a', { class: 'btn ghost', href: a.link, target: '_blank', rel: 'noopener' }, a.label);
        if (a.drawer) return el('button', { class: 'btn ghost', type: 'button', onclick: () => openDrawer(a.drawer, a.label) }, '📖 ' + a.label);
        if (a.mine) return el('button', { class: 'btn', type: 'button', onclick: mine }, a.label);
        if (a.copyText) return el('button', { class: 'btn ghost', type: 'button', onclick: () => copy(a.copyText) }, '📋 ' + a.label);
        if (a.file) return fileBtn(a.file, '⬇ ' + a.label, 'btn ghost');
        if (a.survey) return C.survey
          ? el('a', { class: 'btn', href: C.survey, target: '_blank', rel: 'noopener' }, '📝 ' + a.label)
          : el('span', { class: 'hint' }, '（課後問卷網址待補）');
      });
      st.append(el('div', { class: 'slide-bar' }, el('span', { class: 'seg-code' }, seg.code), el('span', { class: 'slide-t' }, seg.title), el('div', { class: 'btns' }, acts)));
      st.classList.toggle('has-note', !!seg.note);
      if (seg.note) st.append(el('div', { class: 'pnote slide-note' }, '👉 ' + seg.note));
      const src = `slides/${String(seg.slide).padStart(2, '0')}.jpg`;
      const zoom = () => { const z = el('div', { class: 'zoom', onclick: () => z.remove() }, el('img', { src, alt: '' }), el('span', {}, '點任何地方關閉')); document.body.append(z); };
      const img = el('img', { src, alt: `投影片 ${seg.slide}：${seg.title}`, title: '在空白處點一下放大；文字可以直接反白複製', onclick: zoom });
      st.append(el('figure', { class: 'slide' }, img, slideText(seg.slide)));
      if (seg.styleRow || seg.linkRow || seg.stepRow || seg.footRow) st.classList.add('has-rows');
      if (seg.stepRow) st.classList.add('has-steps'); // 三欄步驟卡比單排按鈕高，圖要再讓一點
      // 依投影片上的步驟卡，把按鈕分欄排在圖下方（KT：不要在上排重複一次）
      const oneAct = (a) => {
        if (a.file) return fileBtn(a.file, '⬇ ' + a.label, 'btn ghost');
        if (a.open) return el('button', { class: 'btn dark', type: 'button', onclick: () => openTool(a.open) }, a.label);
        if (a.copy) return el('button', { class: 'btn', type: 'button', onclick: () => copy(D.prompts[a.copy].text) }, '📋 ' + a.label);
        if (a.copyText) return el('button', { class: 'btn', type: 'button', onclick: () => copy(a.copyText) }, '📋 ' + a.label);
        if (a.link) return el('a', { class: 'btn ghost', href: a.link, target: '_blank', rel: 'noopener' }, a.label + ' ↗');
      };
      if (seg.stepRow) st.append(el('div', { class: 'steprow' }, seg.stepRow.map((c) =>
        el('div', { class: 'stepc' }, el('div', { class: 'stepc-h' }, el('span', { class: 'stepc-n' }, c.n), c.label),
          el('div', { class: 'stepc-b' }, c.acts.map(oneAct))))));
      if (seg.footRow) st.append(el('div', { class: 'lkrow' }, seg.footRow.map(oneAct)));
      if (seg.styleRow) st.append(el('div', { class: 'strow' }, seg.styleRow.map(([label, ref]) =>
        el('button', { class: 'btn', type: 'button', onclick: () => copy(D.prompts[ref].text, null, `已複製${label}視覺提示詞！上傳你挑的圖，再貼上送出`) },
          el('b', {}, label), el('span', {}, '📋 複製提示詞')))));
      if (seg.linkRow) st.append(el('div', { class: 'lkrow' }, seg.linkRow.map(([label, href]) =>
        el('a', { class: 'btn ghost', href, target: '_blank', rel: 'noopener' }, label + ' ↗'))));
      set('seen:' + seg.id, true); $('#presentCode').textContent = seg.code; renderNav(); return;
    }
    st.append(el('div', { class: 'seg-head' }, el('span', { class: 'seg-code' }, seg.code, el('span', { class: 'u' }, `${unit.label}${seg.unit && seg.unit < 5 ? '　' + unit.title : ''}`)), el('h1', {}, seg.title), seg.sub ? el('p', { class: 'sub' }, seg.sub) : null));
    if (ul.length) {
      const cards = ul.map((n) => skillCard(n));
      const fresh = ul.some((n) => !get('shown:' + n));
      if (fresh && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        cards.forEach((c) => { c.classList.add('locked'); c.querySelector('.chip').textContent = '未解鎖'; });
        setTimeout(() => cards.forEach((c) => c.classList.add('spin')), 400);
        setTimeout(() => cards.forEach((c) => { c.classList.remove('locked'); c.querySelector('.chip').textContent = '已解鎖'; }), 800);
      }
      ul.forEach((n) => set('shown:' + n, true));
      st.append(el('div', { class: 'block unlock-hero' + (ul.length > 1 ? ' two' : '') }, el('div', {}, el('div', { class: 'ucards' }, cards)), R.takeaway(seg.blocks[0])));
      seg.blocks.slice(1).forEach((b) => st.append(el('div', { class: 'block' }, R[b.type](b, seg, st))));
    } else {
      const mk = (b) => el('div', { class: 'block' }, R[b.type] ? R[b.type](b, seg, st) : el('div', { class: 'wip' }, '未知區塊 ' + b.type));
      const body = seg.layout === 'split'
        ? [el('div', { class: 'split' }, el('div', {}, mk(seg.blocks[0])), el('div', {}, seg.blocks.slice(1).map(mk)))]
        : (seg.blocks || []).map(mk);
      if (seg.quiz && seg.quizFirst) { // 選擇題和應用題排成同一串，用上一題／下一題切換
        st.append(el('div', { class: 'block' }, quiz(seg, () => renderNav(), [body, seg.extraTitle || '應用題'])));
      } else body.forEach((n) => st.append(n));
    }
    if (seg.quiz && !seg.quizFirst) { st.append(el('div', { class: 'block' }, quiz(seg, () => renderNav()))); }
    set('seen:' + seg.id, true);
    $('#presentCode').textContent = seg.code;
    renderNav();
  }
  function go(i) {
    if (i < 0 || i >= SEG.length) return;
    closeDrawer(); document.querySelectorAll('.zoom').forEach((z) => z.remove()); $('#toast').classList.remove('on'); idx = i; history.replaceState(null, '', '#' + SEG[i].id); render();
    window.scrollTo({ top: 0 }); $('#stage').focus({ preventScroll: true });
  }
  $('#prev').onclick = () => go(idx - 1);
  $('#next').onclick = () => go(idx + 1);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { document.querySelectorAll('.zoom').forEach((z) => z.remove()); return closeDrawer(); }
    if (document.querySelector('.zoom')) return;
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || $('#drawer').classList.contains('open')) return;
    if (e.key === 'ArrowRight') go(idx + 1);
    if (e.key === 'ArrowLeft') go(idx - 1);
  });
  $('#tocBtn').onclick = () => $('#side').classList.toggle('open');
  window.addEventListener('hashchange', () => {
    const target = SEG.findIndex((s) => '#' + s.id === location.hash || '#' + s.code === location.hash);
    if (target >= 0 && target !== idx) { idx = target; render(); window.scrollTo({ top: 0 }); }
  });
  const start = SEG.findIndex((s) => '#' + s.id === location.hash || '#' + s.code === location.hash);
  idx = start >= 0 ? start : 0;
  render();
})();
</script>
</body>
</html>
