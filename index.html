<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI 職場應用實作工作坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>:root {
  --navy: #1B2A41; --navy2: #24364F; --ink: #0B1220; --teal: #0E9B8A; --tealDark: #0A7A6C;
  --mint: #E6F7F3; --mint2: #CFF0E8; --coral: #F0705A; --coralBg: #FEF1EE; --amber: #F5B942;
  --off: #F5F7F9; --line: #DCE3EA; --grey: #5B6775; --grey2: #9AA5B1; --slate: #3A4A60; --white: #fff;
  --fs: 18px; --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: var(--fs); line-height: 1.65; color: var(--ink); background: var(--white); padding-bottom: 84px; }
button { font: inherit; cursor: pointer; }
a { color: var(--tealDark); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* 頂列 */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--navy); color: var(--white); }
.brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
.units { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.units button { border: 0; border-radius: 999px; padding: 6px 14px; background: var(--navy2); color: var(--mint2); font-size: 16px; white-space: nowrap; min-height: 40px; }
.units button.on { background: var(--teal); color: var(--white); font-weight: 700; }
.units button.done::after { content: ' ✓'; }
.mine-btn { border: 1px solid var(--mint2); background: transparent; color: var(--white); border-radius: 999px; padding: 6px 14px; font-size: 16px; min-height: 40px; white-space: nowrap; }

/* 舞台 */
.stage { max-width: 1040px; margin: 0 auto; padding: 28px 24px 40px; outline: none; }
.seg-head { margin-bottom: 22px; }
.seg-code { display: inline-block; background: var(--mint); color: var(--tealDark); font-weight: 700; font-size: 16px; padding: 2px 12px; border-radius: 999px; margin-bottom: 8px; }
.seg-code .u { color: var(--grey); font-weight: 500; margin-left: 6px; }
h1 { font-size: 30px; line-height: 1.35; margin: 0 0 6px; }
.sub { color: var(--grey); margin: 0; }
.block { margin: 20px 0; }
.wip { background: var(--off); border-radius: var(--radius); padding: 24px; color: var(--grey); }

/* 通用卡 */
.callout { background: var(--mint); color: var(--tealDark); font-weight: 700; border-radius: var(--radius); padding: 16px 20px; }
.callout.dark { background: var(--navy); color: var(--white); }
.source { color: var(--grey2); font-size: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two > div, .rows > div, .steps > div { background: var(--off); border-radius: var(--radius); padding: 16px 20px; }
.two h3 { margin: 0 0 4px; font-size: 20px; color: var(--tealDark); }
.two p { margin: 0; }
.rows { display: grid; gap: 10px; }
.rows > div { display: grid; grid-template-columns: 44px 220px 1fr; align-items: center; gap: 12px; }
.num { width: 36px; height: 36px; border-radius: 9px; background: var(--teal); color: var(--white); font-weight: 700; display: grid; place-items: center; font-size: 16px; }
.rows b { font-size: 19px; }
.rows span { color: var(--grey); }
.rows span.num { color: var(--white); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; counter-reset: s; }
.steps > div { border-top: 5px solid var(--teal); }
.steps b { display: block; font-size: 19px; margin-bottom: 4px; }
.howto { color: var(--grey); padding-left: 1.2em; margin: 0; }

/* 展開卡 */
.expand { display: grid; gap: 10px; }
.expand.grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.xcard { border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); overflow: hidden; }
.xcard > button { width: 100%; text-align: left; border: 0; background: var(--off); padding: 14px 18px; font-size: 19px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; }
.xcard > button::after { content: '＋'; color: var(--teal); font-size: 22px; }
.xcard.open > button { background: var(--mint); }
.xcard.open > button::after { content: '－'; }
.xcard .xbody { display: none; padding: 14px 18px; white-space: pre-line; }
.xcard.open .xbody { display: block; }
.hint { color: var(--grey); font-size: 16px; }

/* 翻卡 */
.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.flip { perspective: 900px; width: 100%; height: 190px; border: 0; background: none; padding: 0; text-align: left; }
.flip .in { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.flip.on .in { transform: rotateY(180deg); }
.flip .f, .flip .b { position: absolute; inset: 0; border-radius: var(--radius); backface-visibility: hidden; padding: 18px; display: flex; flex-direction: column; justify-content: center; }
.flip .f { background: var(--navy); color: var(--white); }
.flip .f .big { font-size: 56px; font-weight: 700; color: var(--teal); line-height: 1; }
.flip .f .nm { font-size: 20px; font-weight: 700; margin-top: 8px; }
.flip .b { background: var(--mint); color: var(--ink); transform: rotateY(180deg); font-size: 18px; }
.flip .b b { color: var(--tealDark); display: block; margin-bottom: 6px; }
.flip .tap { position: absolute; right: 14px; bottom: 10px; font-size: 14px; color: var(--mint2); }

/* 技能卡 */
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.skill { height: 260px; }
.skill .f { justify-content: flex-start; }
.skill .f .big { font-size: 52px; }
.skill .f .tg { color: var(--mint2); font-size: 16px; margin-top: 8px; }
.skill .chip { position: absolute; top: 16px; right: 16px; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--amber); color: var(--ink); }
.skill.locked .f { background: var(--slate); }
.skill.locked .f .big { color: #8FA0B5; }
.skill.locked .chip { background: #5B6B80; color: var(--white); }
.skill .b { font-size: 16px; line-height: 1.55; justify-content: flex-start; overflow: auto; }
.skill .b p { margin: 0 0 6px; }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.unlock-hero { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
.unlock-hero .skill { height: 320px; }
.takeaway { background: var(--off); border-radius: var(--radius); padding: 18px 22px; }
.takeaway h3 { margin: 0 0 10px; color: var(--teal); font-size: 18px; }
.takeaway div { margin-bottom: 12px; }
.takeaway b { font-size: 19px; display: block; }
.takeaway span { color: var(--grey); }
.confetti { font-size: 22px; font-weight: 700; color: var(--tealDark); margin-bottom: 8px; }

/* 高亮拆解 */
.hl-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.hl-tabs button { border: 2px solid var(--line); background: var(--white); border-radius: 10px; min-width: 64px; min-height: 48px; font-weight: 700; font-size: 20px; }
.hl-tabs button.on { border-color: var(--teal); background: var(--teal); color: var(--white); }
.hl-text { background: var(--off); border-radius: var(--radius); padding: 20px; font-size: 20px; line-height: 1.9; }
.hl-text span { border-radius: 6px; padding: 2px 4px; transition: background .2s; }
.hl-text span.on { background: var(--amber); }
.hl-text span .lt { font-size: 14px; font-weight: 700; color: var(--tealDark); margin-right: 4px; }

/* 提示詞框 */
.pbox-ui { border: 2px solid var(--teal); border-radius: var(--radius); overflow: hidden; background: var(--white); }
.pbox-ui .ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; background: var(--mint); flex-wrap: wrap; }
.pbox-ui .ph b { color: var(--tealDark); }
.pbox-ui pre { margin: 0; padding: 16px 18px; white-space: pre-wrap; font-family: inherit; font-size: 17px; line-height: 1.7; max-height: 360px; overflow: auto; }
.pbox-ui.long pre { max-height: 220px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 8px 16px; min-height: 44px; font-size: 16px; font-weight: 700; background: var(--teal); color: var(--white); }
.btn.ghost { background: var(--white); color: var(--tealDark); border: 1.5px solid var(--teal); }
.btn.dark { background: var(--navy); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.openers { padding: 10px 16px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.openers .lbl { color: var(--grey); font-size: 15px; margin-right: 4px; }

/* 填寫器 */
.privacy { background: var(--coralBg); border-left: 5px solid var(--coral); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: 16px; margin-bottom: 12px; }
.builder { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.field { margin-bottom: 12px; }
.field label { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 4px; }
.field .lt { width: 32px; height: 32px; border-radius: 8px; background: var(--navy); color: var(--mint2); display: grid; place-items: center; font-size: 17px; }
.field textarea, .scen input { width: 100%; font: inherit; font-size: 17px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 64px; }
.field textarea:focus, .scen input:focus { border-color: var(--teal); outline: none; }
.field .ex { font-size: 15px; color: var(--grey); margin-top: 2px; }
.field .ex button { border: 0; background: none; color: var(--tealDark); text-decoration: underline; font-size: 15px; padding: 0; }
.preview { position: sticky; top: 76px; align-self: start; }
.preview pre .empty { color: var(--grey2); }
.warn { color: var(--coral); font-size: 15px; font-weight: 700; min-height: 1.5em; }

/* 測驗 */
.quiz { display: grid; gap: 18px; }
.q { background: var(--off); border-radius: var(--radius); padding: 18px 20px; }
.q h3 { margin: 0 0 12px; font-size: 20px; line-height: 1.5; }
.q .opts { display: grid; gap: 8px; }
.q .opts button { text-align: left; border: 1.5px solid var(--line); background: var(--white); border-radius: 10px; padding: 10px 14px; min-height: 48px; font-size: 18px; }
.q .opts button:hover:not(:disabled) { border-color: var(--teal); }
.q .opts button.right { border-color: var(--teal); background: var(--mint); font-weight: 700; }
.q .opts button.wrong { border-color: var(--coral); background: var(--coralBg); }
.q .opts button:disabled { cursor: default; }
.q .exp { margin-top: 10px; font-size: 17px; }
.q .exp b.ok { color: var(--tealDark); }
.q .exp b.no { color: var(--coral); }
.score { font-weight: 700; color: var(--tealDark); font-size: 20px; }
.gate-msg { color: var(--grey); font-size: 16px; }

/* 勾選、評分、情境 */
.checks { background: var(--off); border-radius: var(--radius); padding: 14px 18px; }
.checks h3 { margin: 0 0 8px; font-size: 19px; color: var(--tealDark); }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.checks input { width: 22px; height: 22px; margin-top: 4px; accent-color: var(--teal); flex: none; }
.checks .done-msg { color: var(--tealDark); font-weight: 700; margin-top: 6px; }
.checks .gnote { color: var(--coral); font-weight: 700; font-size: 16px; margin-top: 4px; }
.fit-result { margin-top: 10px; font-size: 20px; font-weight: 700; color: var(--tealDark); }
.meter { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--teal); transition: width .3s; }
.scen .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-bottom: 10px; }
.scen .row label { font-size: 15px; color: var(--grey); display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chips button { border: 1.5px solid var(--teal); background: var(--white); color: var(--tealDark); border-radius: 999px; padding: 4px 14px; min-height: 40px; font-size: 16px; }
.saved { color: var(--grey); font-size: 15px; }

/* 流程、跳轉、空泛版 */
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.flow div { flex: 1 1 110px; background: var(--off); border-radius: 10px; padding: 12px 8px; text-align: center; font-weight: 700; font-size: 17px; display: grid; place-items: center; }
.flow div.g { background: var(--tealDark); color: var(--white); }
.flow div.end { background: var(--navy); color: var(--white); }
.jump { display: grid; gap: 10px; }
.jump button { text-align: left; border: 1.5px solid var(--line); background: var(--white); border-radius: var(--radius); padding: 14px 18px; font-size: 19px; display: flex; gap: 14px; align-items: center; min-height: 60px; }
.jump button:hover { border-color: var(--teal); }
.jump button.seen { background: var(--mint); }
.vague { background: #EEF1F4; border-radius: var(--radius); padding: 18px 20px; }
.vague .lb { color: var(--grey); font-weight: 700; font-size: 16px; }
.vague p { font-size: 22px; font-weight: 700; margin: 6px 0; }
.pick { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pick button { width: 64px; height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--white); font-size: 22px; font-weight: 700; }
.pick button.on { background: var(--teal); border-color: var(--teal); color: var(--white); }
.locked-note { color: var(--grey); font-size: 16px; background: var(--off); border-radius: 10px; padding: 12px 16px; }
.fallback { border: 1.5px dashed var(--grey2); border-radius: var(--radius); padding: 14px 18px; }
.fallback h3 { margin: 0 0 4px; font-size: 18px; }
.drawer-link { border: 0; background: none; color: var(--tealDark); font-weight: 700; font-size: 17px; padding: 6px 0; text-decoration: underline; text-underline-offset: 4px; }
.drawer-link::before { content: '📖 '; }

/* 翻頁列 */
.pager { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); }
.pager button { border: 1.5px solid var(--teal); background: var(--white); color: var(--tealDark); border-radius: 12px; padding: 8px 20px; min-height: 48px; font-size: 17px; font-weight: 700; }
.pager button.primary { background: var(--teal); color: var(--white); }
.pager button:disabled { opacity: .4; cursor: not-allowed; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots button { width: 12px; height: 12px; min-height: 0; padding: 0; border-radius: 50%; border: 0; background: var(--line); }
.dots button.seen { background: var(--mint2); }
.dots button.on { background: var(--teal); transform: scale(1.3); }

/* 側頁 */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--white); z-index: 40; box-shadow: -8px 0 30px rgba(0,0,0,.18); transform: translateX(105%); transition: transform .3s; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--navy); color: var(--white); font-weight: 700; }
.drawer-head button { border: 1px solid var(--mint2); background: none; color: var(--white); border-radius: 999px; padding: 4px 14px; min-height: 40px; }
.drawer-body { padding: 18px 22px 40px; overflow: auto; font-size: 17px; }
.drawer-body h2 { font-size: 22px; color: var(--navy); border-bottom: 3px solid var(--teal); padding-bottom: 6px; }
.drawer-body h3 { font-size: 18px; color: var(--teal); margin-bottom: 4px; }
.drawer-body p { margin: 6px 0; }
.drawer-body .note { background: var(--coralBg); border-left: 4px solid var(--coral); padding: 8px 12px; border-radius: 6px; }
.drawer-body table { border-collapse: collapse; width: 100%; font-size: 16px; margin: 8px 0; }
.drawer-body th { background: var(--teal); color: var(--white); text-align: left; padding: 6px 8px; }
.drawer-body td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
.drawer-body .pbox-ui { margin: 10px 0; }
.scrim { position: fixed; inset: 0; background: rgba(11,18,32,.35); z-index: 35; display: none; }
.scrim.on { display: block; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--navy); color: var(--white); padding: 12px 20px; border-radius: 12px; font-weight: 700; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
.toast.on { opacity: 1; }

/* 我的成果 */
.mine h2 { font-size: 20px; color: var(--navy); }
.mine .item { background: var(--off); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; white-space: pre-wrap; }
.mine .item b { color: var(--tealDark); display: block; }

/* 投影模式 */
.present-code { display: none; }
body.present { --fs: 26px; }
body.present .stage { max-width: 1500px; }
body.present h1 { font-size: 48px; }
body.present .privacy, body.present .field .ex { display: none; }
body.present .present-code { display: block; position: fixed; right: 24px; bottom: 90px; z-index: 30; background: var(--navy); color: var(--white); font-size: 56px; font-weight: 700; padding: 6px 22px; border-radius: 16px; }
body.present .flip { height: 250px; }
body.present .rows > div { grid-template-columns: 56px 320px 1fr; }

/* 手機 */
@media (max-width: 760px) {
  :root { --fs: 17px; }
  .brand { display: none; }
  .top { padding: 8px 12px; gap: 8px; }
  .stage { padding: 20px 16px 40px; }
  h1 { font-size: 24px; }
  .two, .builder, .unlock-hero { grid-template-columns: 1fr; }
  .rows > div { grid-template-columns: 40px 1fr; }
  .rows > div span { grid-column: 2; }
  .steps { grid-template-columns: 1fr 1fr; }
  .scen .row { grid-template-columns: 1fr; }
  .preview { position: static; }
  .pager { padding: 8px 10px; }
  .pager button { padding: 8px 12px; }
  .dots { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .flip .in, .drawer, .meter i { transition: none; }
  .shake { animation: none; }
}

/* v1.1 */
.pnote { background: #FFF8E6; color: var(--ink); font-size: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.pick-msg { margin-top: 10px; font-weight: 700; color: var(--tealDark); min-height: 1.5em; }
.q .opts button:disabled { color: var(--ink); opacity: 1; }
.q .opts button:disabled:not(.right):not(.wrong) { color: var(--grey2); }
.hl-ask { font-weight: 700; font-size: 20px; color: var(--navy); margin-bottom: 10px; }
.hl-text.guess { display: grid; gap: 8px; }
.hl-s { text-align: left; border: 2px dashed var(--line); background: var(--white); border-radius: 10px; padding: 10px 14px; font-size: 19px; line-height: 1.7; }
.hl-s:hover { border-color: var(--teal); }
.hl-s .lt { display: none; }
.hl-s.found { border-style: solid; border-color: var(--teal); background: #FFF4D6; }
.hl-s.found .lt { display: inline-block; background: var(--teal); color: var(--white); border-radius: 6px; padding: 0 8px; margin-right: 8px; font-size: 15px; }
.task-in { width: 100%; font: inherit; font-size: 17px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 4px 0 10px; }
.redline .rl { color: var(--coral); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
body.present .q h3, body.present .q .opts button, body.present .pbox-ui pre, body.present .xcard > button, body.present .xcard .xbody,
body.present .rows b, body.present .rows span, body.present .checks label, body.present .hl-s, body.present .flow div, body.present .steps > div { font-size: 24px; }
body.present .field textarea { font-size: 22px; }
.q.think { border-left: 5px solid var(--amber); }

/* v0.3 版面：側欄＋進度＋投影片頁 */
body { padding-bottom: 72px; }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 60px - 72px); }
.side { background: var(--off); border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 60px; height: calc(100vh - 60px - 72px); overflow: auto; }
.side-h { font-size: 15px; font-weight: 700; color: var(--grey); padding: 4px 10px 10px; }
.side-i { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 10px; font-size: 15px; line-height: 1.35; color: var(--ink); min-height: 40px; }
.side-i:hover { background: var(--mint); }
.side-i .no { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--grey2); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--grey); }
.side-i.seen .no { border-color: var(--teal); color: var(--tealDark); }
.side-i.on { background: var(--navy); color: var(--white); }
.side-i.on .no { background: var(--teal); border-color: var(--teal); color: var(--white); }
.side-i .tt { flex: 1; }

<script>window.DATA={"prompts": {"A": {"title": "附錄 A　文件格式萃取與複用助手（完整系統提示詞）", "text": "# 文件格式萃取與複用助手\n\n你是一位熟悉行政文書、工作文件分析與內容查核的「文件格式萃取與複用助手」。\n\n你的任務是協助使用者完成兩件事：\n\n1. 從一份已經完成的成品文件中，萃取可重複使用的格式。\n2. 將萃取出的格式套用到新的素材，產生同類型的新文件。\n\n這兩個階段必須分開執行。\n\n完成第一階段後，不得自動進入第二階段。只有當使用者明確要求「套用模板」，並提供新素材後，才可以進入第二階段。\n\n\n# 一、首次互動的開場引導\n\n當使用者第一次開啟 Gem，或尚未提供明確任務時，請使用以下開場方式：\n\n你好，我可以協助你把一份已完成的工作文件，轉換成可以重複使用的模板。\n\n你可以使用以下兩種功能：\n\n1. 萃取格式\n請提供一份已經填寫完成的文件，我會分析它的結構、欄位與寫作規則，整理成可重複使用的模板。\n\n2. 套用模板\n如果你已經有一份模板，可以再提供新的會議內容、逐字稿、工作資料或其他素材，我會先檢查資料是否足夠，再協助你產生一份新文件。\n\n建議先從「萃取格式」開始。\n\n請上傳一份已經完成的文件，並告訴我：\n「請幫我萃取這份文件的格式。」\n\n開場說明應保持簡短清楚，不要一次向使用者說明所有內部規則。\n\n\n# 二、模式判斷\n\n請根據使用者的指令判斷目前要執行的模式。\n\n## 模式一：萃取格式\n\n當使用者：\n\n- 上傳一份已完成的文件\n- 說「萃取格式」\n- 說「把這份文件做成模板」\n- 說「分析這份文件的格式」\n- 或提出意思相近的要求\n\n請執行「第一階段：萃取格式」。\n\n## 模式二：套用模板\n\n當使用者：\n\n- 明確說「套用模板」\n- 要求用既有格式產生一份新文件\n- 同時提供模板與新的原始素材\n- 或提出意思相近的要求\n\n請執行「第二階段：套用模板」。\n\n## 無法判斷時\n\n如果無法判斷使用者要萃取格式還是套用模板，請只問：\n\n請問你現在想要：\n\n1. 從成品文件中萃取格式\n2. 把既有模板套用到新的素材\n\n請選擇其中一項，我再繼續協助你。\n\n不要自行選擇模式。\n\n\n# 三、第一階段：萃取格式\n\n## 第一階段的任務\n\n當使用者提供一份已完成的文件時，請分析這份文件背後可重複使用的：\n\n- 文件結構\n- 標題層級\n- 固定欄位\n- 替換欄位\n- 選填欄位\n- 表格結構\n- 各段落的功能\n- 寫作語氣\n- 內容詳細程度\n- 完成文件前需要準備的資料\n\n這個階段的任務是「萃取格式」，不是摘要、改寫或重新產出文件內容。\n\n\n## 第一階段的重要規則\n\n1. 必須以使用者提供的成品文件為主要依據。\n2. 不要把文件中的特定人名、日期、地點、事件、數字或議題當成固定格式。\n3. 不要把單次會議的決議或內容誤認為每次都要保留的固定文字。\n4. 不要自行增加原文件不存在的欄位。\n5. 不要在這個階段產生新的工作文件。\n6. 不要只把原文件清空，必須進一步說明各欄位的功能與使用規則。\n7. 如果某項規則只能從單一文件推測，請標示：\n   「可能的格式規則，建議人工確認。」\n8. 如果使用者提供的是空白表格，而不是已完成的成品，請主動提醒：\n   「這是一份空白表格，可以辨識欄位，但不足以完整判斷各欄位實際的寫作方式。若要準確萃取模板，建議再提供一份已填寫完成的文件。」\n9. 若文件涉及醫療、護理、個資或其他敏感內容，提醒使用者確認資料已完成適當的去識別化處理。\n10. 不要因為文件中有空白欄位，就自行判斷該欄位是選填、不適用或應刪除。\n\n\n## 第一階段的輸出格式\n\n請依照以下順序輸出：\n\n### 一、文件名稱與用途\n\n說明：\n\n- 這是什麼類型的文件\n- 通常在什麼情境下使用\n- 主要目的是什麼\n\n如果用途無法從文件中確認，請清楚標示需要使用者確認。\n\n\n### 二、文件結構地圖\n\n依照原文件的實際順序，列出：\n\n- 文件標題\n- 基本資料\n- 主要章節\n- 次要章節\n- 固定欄位\n- 表格欄位\n- 結尾資訊\n- 附件或簽核區\n\n必須保留原文件的層級與順序。\n\n\n### 三、欄位分類\n\n將辨識出的內容分成以下三類：\n\n#### 固定結構\n\n每次使用時通常會保留的：\n\n- 標題\n- 章節\n- 欄位名稱\n- 表格欄名\n- 文件順序\n\n#### 每次替換的內容\n\n每次製作新文件時，需要依新素材更新的內容。\n\n#### 視情況使用的內容\n\n只有特定情況才會出現的段落或欄位。\n\n如果無法確定某個欄位是否為選填，請標示：\n\n「是否選填需要使用者確認。」\n\n\n### 四、各段落的寫作規則\n\n針對每個主要段落說明：\n\n- 這一段要放什麼內容\n- 要回答什麼問題\n- 使用什麼語氣\n- 大約需要多詳細\n- 是否需要條列\n- 是否需要保留正式用語\n- 是否涉及裁示、決議、責任或簽核\n- 容易出錯的地方\n\n\n### 五、可重複使用的文件模板\n\n依照原文件的結構，建立一份可直接複製的模板。\n\n需要替換的內容統一使用以下形式：\n\n［欄位名稱］\n\n例如：\n\n時間：［會議日期與時間］\n地點：［會議地點］\n主席：［主席姓名與職銜］\n\n模板中只能保留：\n\n- 固定結構\n- 固定欄位名稱\n- 必要的寫作提示\n\n不得保留原文件中特定的人名、事件、日期、數字或個案內容。\n\n\n### 六、使用模板前需要準備的資料\n\n列出使用者下一次套用模板時，需要提供哪些資料。\n\n例如：\n\n- 日期與時間\n- 地點\n- 參與人員\n- 原始逐字稿\n- 會議議程\n- 發言內容\n- 決議內容\n- 負責單位\n- 執行期限\n\n請依實際文件類型調整，不要直接套用上述範例。\n\n\n### 七、格式檢查清單\n\n列出完成新文件後需要人工確認的項目，包括：\n\n- 結構是否完整\n- 欄位是否遺漏\n- 人名與職稱是否正確\n- 日期與數字是否正確\n- 發言、建議、裁示與決議是否清楚區分\n- 是否含有不應公開的個人資料\n- 是否需要主管、承辦人或專業人員複核\n\n\n# 四、第一階段完成後的引導\n\n完成格式萃取後，請在回覆最後加入以下提醒：\n\n格式已經萃取完成。\n\n接下來你可以：\n\n1. 先檢查這份模板是否符合你實際工作的使用方式\n2. 告訴我需要修改、增加或刪除哪些欄位\n3. 提供一份新的原始素材，請我將內容套用到這份模板\n\n如果你要繼續，請提供新的素材並告訴我：\n「請將這份素材套用到剛才的模板。」\n\n進入套用階段後，我會先檢查新素材是否足以完成模板。若資料不足、文件性質不同，或有內容無法判斷，我會先向你提問，不會自行補寫。\n\n\n# 五、第二階段：套用模板\n\n## 第二階段的啟動條件\n\n只有當使用者明確要求「套用模板」，並提供新的原始素材後，才能進入第二階段。\n\n不要因為第一階段已經完成，就自行接續產生新文件。\n\n\n## 第二階段的第一個動作：資料適用性檢查\n\n產出文件前，必須先比對模板與新素材。\n\n請檢查：\n\n1. 新素材與原模板是否屬於相同或相近的文件類型\n2. 模板需要哪些必要資料\n3. 新素材已經提供哪些資料\n4. 哪些重要資料仍然缺少\n5. 哪些模板欄位不適用於新素材\n6. 哪些內容可能需要推測才能填寫\n7. 新素材中是否清楚區分發言、建議、回覆、裁示與正式決議\n8. 是否含有需要去識別化的個人資料或敏感資訊\n\n\n# 六、必須先提問的情況\n\n遇到以下任一情況時，不得直接產出完整文件：\n\n- 無法確認文件日期或時間\n- 無法確認文件地點\n- 無法確認主持人、主席、紀錄人或相關人員\n- 無法確認人物姓名或職銜\n- 無法判斷內容是發言、建議、回覆、裁示或正式決議\n- 新素材缺少模板中的關鍵資料\n- 新素材的文件性質與模板不同\n- 原模板中的部分欄位不適用於新素材\n- 必須依靠推測才能完成內容\n- 來源資料彼此矛盾\n- 不確定某個欄位應保留、刪除、留白或標示不適用\n- 新素材只包含部分內容，無法代表完整事件或完整會議\n\n遇到上述情況時，請先輸出「產出前確認」。\n\n\n# 七、產出前確認\n\n請使用以下格式：\n\n## 產出前確認\n\n### 目前可以確認的資料\n\n列出新素材中可以直接確認的資訊。\n\n### 缺少的關鍵資料\n\n列出模板需要、但新素材沒有提供的資訊。\n\n### 模板與新素材不一致的地方\n\n說明：\n\n- 哪些欄位不適用\n- 哪些段落需要調整\n- 原模板與新素材的文件性質有何不同\n\n### 需要你確認的問題\n\n一次最多提出五個最關鍵的問題。\n\n問題必須具體且容易回答。\n\n例如：\n\n1. 這份文件的正式日期為何？\n2. 影片中的主持人是否等同正式會議主席？\n3. 公聽會沒有正式裁示時，你希望保留欄位並標示不適用，還是刪除該欄位？\n4. 這次要整理整場內容，還是只整理指定的時間範圍？\n5. 發言人的姓名與職銜是否已有正式名單可供核對？\n\n提出問題後必須停止，等待使用者回答。\n\n在使用者回答以前，不得產出完整文件。\n\n\n# 八、第二階段的產出規則\n\n收到使用者補充或選擇後，才能產出文件。\n\n產出時必須遵守以下規則：\n\n1. 只使用使用者提供，或新素材中可以直接確認的資訊。\n2. 不得為了填滿模板而推測、腦補或合理化缺少的內容。\n3. 不得使用影片發布日期推測活動或會議日期。\n4. 不得根據畫面、稱呼或一般背景知識，自行判斷人物姓名、身分與職銜。\n5. 不得把主持人自動視為正式主席。\n6. 不得把發言、建議、期待、倡議或討論內容改寫成主席裁示。\n7. 不得把個人主張或團體訴求改寫成正式決議。\n8. 不得自行產生主管機關回覆、行政承諾、執行方式、改善時程或列管結果。\n9. 未經使用者確認，不得自行填寫「無」「略」「洽悉」「解除列管」或其他具有正式文件意義的文字。\n10. 未經使用者確認，不得自行刪除、留白或標示不適用。\n11. 若使用者提供的資料只涵蓋部分內容，必須標示本文件的資料範圍。\n12. 如果來源互相矛盾，必須再次請使用者決定，不可自行選擇。\n13. 涉及醫療、護理或其他專業內容時，必須提醒由專業人員複核。\n\n\n# 九、資料不足時的處理選項\n\n如果使用者無法補充缺少的資料，請詢問使用者希望如何處理各缺漏欄位：\n\n1. 保留欄位並標示「待確認」\n2. 標示「不適用」\n3. 刪除該欄位\n4. 暫不產出，等資料補齊後再繼續\n\n不得替使用者選擇。\n\n\n# 十、使用者要求先產出草稿時\n\n如果使用者明確表示：\n\n「請先依現有資料產出，缺少內容標示待確認。」\n\n你可以繼續製作草稿。\n\n但仍須遵守：\n\n- 不得自行推測\n- 不得補寫來源中沒有的內容\n- 不得把發言轉換成裁示或決議\n- 不得把影片發布時間當成事件日期\n- 必須清楚標示資料範圍\n- 必須在文件後列出待確認資訊\n\n\n# 十一、第二階段的輸出格式\n\n資料確認完成後，請依序輸出：\n\n## 一、使用的模板\n\n簡要說明這次套用的文件格式。\n\n## 二、資料範圍\n\n說明這次使用的素材範圍。\n\n如果是影片，應標示：\n\n- 影片名稱\n- 使用的開始時間\n- 使用的結束時間\n\n如果無法確認時間，必須向使用者提問，不得自行選擇。\n\n## 三、完成的新文件\n\n依照確認後的模板產出完整文件。\n\n## 四、仍待確認的資訊\n\n只列出經使用者同意保留為「待確認」的項目。\n\n## 五、調整或刪除的模板欄位\n\n說明哪些欄位因文件性質不同而調整、標示不適用或刪除。\n\n## 六、人工查核提醒\n\n列出需要人工回看、比對或專業複核的內容。\n\n\n# 十二、整體語言與互動原則\n\n1. 使用繁體中文。\n2. 語氣清楚、專業、容易理解。\n3. 一次只完成使用者目前指定的階段。\n4. 不要一次提供過多理論說明。\n5. 問題應具體、簡短且容易回答。\n6. 不要假裝知道來源沒有提供的資訊。\n7. 正確與可查核性優先於文件完整度。\n8. 寧可先詢問，也不要自行補寫。\n9. 使用者未授權前，不得自行做出文件結構上的重大修改。\n10. 所有正式文件都應保留人工確認與最終審核。"}, "1-1": {"title": "提示詞 1-1　PTCF 空白模板", "text": "P　你是一位［角色］。\nT　請幫我［要完成的產物］。\nC　這份產出要給［對象］使用，情境是［情境］。請只依據［來源］，不要加入來源沒有的內容。\nF　請用［篇幅／結構／語氣］輸出，使用繁體中文。"}, "範例": {"title": "範例", "text": "P　你是一位熟悉護理教育、醫療政策與生成式 AI 應用的教學設計顧問。\nT　閱讀衛福部指引，挑選護理主管與護理人員最需要理解的內容，規劃成三頁教學簡報。\nC　用於私醫護協會 AI 課程第一單元；對象不具資訊治理背景；講解約五分鐘。重要主張只依 Notebook 來源。\nF　繁體中文，輸出三頁簡報規劃；每頁包含標題、一句核心觀念、最多三項教學重點及對應來源。"}, "2-1": {"title": "提示詞 2-1　萃取格式（上傳成品文件後）", "text": "請幫我萃取這份文件的格式。"}, "2-2": {"title": "提示詞 2-2　套用模板（上傳新素材後）", "text": "請將這份素材套用到剛才的模板。"}, "3-1": {"title": "提示詞 3-1　訪談：產出課程設定卡", "text": "你是一位資深教學設計顧問，熟悉在職教育與 ADDIE。請用訪談的方式帶我完成 A（分析），最後產出一張「課程設定卡」；這個階段不要產出課綱或簡報。\n現在就開始訪談，直接問我第一個問題，不要先摘要來源。最多五個主問題、5 分鐘內問完；一次只問一題，每題附 2–3 個建議答案讓我挑；我答得太籠統時，同一題最多追問一次，之後記成「待確認」往下走；可以先用來源檔名猜答案，用「我猜是……對嗎？」讓我確認。這些問題的答案由我提供，不必從來源尋找。\n五題依序問：① 這堂課要教給誰？他們最卡在哪？② 要教什麼主題？手上有哪些素材？③ 形式與人數？④ 總共多少時間？其中多少留給動手？⑤ 學完要能做出或判斷什麼？\n問完後輸出【課程設定卡】：課程名稱、對象與起點、要解決的工作問題、形式與時數、學習目標（學員能夠＋動詞＋具體成果）、驗收方式、待確認事項。輸出後問我哪一項要改；我說確認之後就停下來，不要自動往下做課綱。"}, "3-2": {"title": "提示詞 3-2　課程大綱", "text": "請讀取來源《教學的技術》這篇文章，用文章裡的做法引導我規劃課程大綱。\n如果我沒有素材，請你先根據來源提出草案，再問我要補充或調整什麼。一次只做一個步驟，做完停下來等我確認。\n課綱的每一段都要寫出：段落名稱／對應的學習目標／這段要教什麼／用什麼教法（問答、討論、演練、影片）／分鐘數／怎麼確認學員聽懂了。\n分鐘數加總必須等於課程總時數。來源不足的地方先問我，不要自行補寫。\n全部段落完成後，列出你認為最弱的三點與修改建議，等我決定。"}, "3-3": {"title": "提示詞 3-3　簡報內容", "text": "請依照剛才確認的課綱，直接產出這堂課的簡報內容，包含骨架與每一頁的內文。\n頁數請你先依課程時數建議：60 分鐘以內的課程控制在 20 頁以內，並說明分配理由。\n每一頁請輸出：頁碼／這頁的教學任務／對應課綱段落與學習目標／標題／核心觀念一句／最多三個重點（每個 20 字以內）／講稿 3–5 句／依據來源的哪一章或哪一頁。\n如果一次輸出太長被截斷，就每 5 頁分一批，做完等我說繼續。\n沒有我說「開始生成簡報」之前，不要用 Studio 產生簡報檔。"}, "4-1": {"title": "提示詞 4-1　技能卡 1：寫文案", "text": "P　你是一位擅長資訊圖像化的設計師。\nT　請把我提供的衛教資料，改寫成一張衛教圖卡的文案。\nC　這張圖卡要給［對象］看，他們現在最困擾的是［困擾］，希望他們看完能［行動］。請用白話說明，只使用我提供的資料，不要加入資料裡沒有的醫療建議。\nF　版面是一張 A4 直式圖卡，文字量要放得下；使用繁體中文。"}, "4-2": {"title": "提示詞 4-2　技能卡 2：萃取風格（上傳參考圖後）", "text": "請把這張圖的視覺風格描述成可重複使用的提示詞：配色、插圖風格、字體感、留白與構圖。不要描述圖的內容。"}, "4-3": {"title": "提示詞 4-3　生成衛教圖卡", "text": "請生成一張 A4 直式的衛教圖卡。\n文案：［貼上提示詞 4-1 的文案］\n風格：［貼上提示詞 4-2 的風格描述］\n文字使用繁體中文，完整照文案呈現，不要增減內容；重點資訊要清楚易讀，不要被裝飾蓋掉。"}}, "sections": {"0.1": "<h2>0.1　課前準備</h2>\n<p class=\"li\">1. 使用 <strong>Google 個人帳號</strong>登入（公司或學校帳號可能被停用 AI 功能）。</p>\n<p class=\"li\">2. 先開啟兩個工具，確認可以使用：</p>\n<p class=\"li\">• Gemini：gemini.google.com</p>\n<p class=\"li\">• Gemini Notebook：在 Gemini 左側欄開啟，或至 notebooklm.google.com</p>\n<p class=\"li\">3. 確認電腦可以上傳檔案（PDF、Word、圖片）。</p>", "0.2": "<h2>0.2　資料紅線</h2>\n<h3>這些資料，不進 AI</h3>\n<p class=\"li\">• 病人姓名、病歷號、床號</p>\n<p class=\"li\">• 可辨識的同仁資料</p>\n<p class=\"li\">• 未公開的院內資訊</p>\n<p class=\"li\">• 不在院內核准清單的工具</p>\n<h3>這些產出，先過人的檢查</h3>\n<p class=\"ck\">☐ 來源回得去嗎？</p>\n<p class=\"ck\">☐ 內容有沒有補寫？</p>\n<p class=\"ck\">☐ 適合現在這個情境嗎？</p>\n<p class=\"ck\">☐ 由誰簽名負責？</p>\n<p class=\"note\">出處：衛生福利部《醫療機構應用生成式人工智慧指引》（115 年 5 月 29 日函頒）</p>", "0.3": "<h2>0.3　四張技能卡</h2>\n<table><tr><th>技能卡</th><th>一句話</th><th>使用單元</th></tr><tr><td>01　PTCF 溝通框架</td><td>四個欄位，把腦中的想法一次說清楚。</td><td>單元一、單元四</td></tr><tr><td>02　範例萃取法</td><td>給 AI 一份好文件，它幫您找出規則。</td><td>單元二、單元四</td></tr><tr><td>03　AI 訪談釐清法</td><td>說不清楚？讓 AI 一題一題問您。</td><td>單元三</td></tr><tr><td>04　AI 隨身教練</td><td>給 AI 一篇文章，它照著帶您做。</td><td>單元三</td></tr></table>", "1.1": "<h2>1.1　PTCF 四要素</h2>\n<table><tr><th>要素</th><th>說明</th></tr><tr><td>P　角色 Persona</td><td>AI 要站在誰的位置思考與說話</td></tr><tr><td>T　任務 Task</td><td>這次要完成哪一個具體產物</td></tr><tr><td>C　背景 Context</td><td>對象、情境、來源與不能踩的限制</td></tr><tr><td>F　格式 Format</td><td>篇幅、結構、語氣與驗收標準</td></tr></table>", "1.2": "<h2>1.2　PTCF 空白模板</h2>\n<div class=\"pbox\" data-pid=\"1-1\"></div>\n<h3>範例：同一個任務的完整版</h3>\n<div class=\"pbox\" data-pid=\"範例\"></div>", "1.3": "<h2>1.3　衛福部指引：使用前後的三道檢查</h2>\n<h3>輸入前：資料能不能交給 AI</h3>\n<table><tr><th>檢查</th><th>問自己</th></tr><tr><td>工具</td><td>符合院內規範嗎？資料如何處理與保存？個人帳號可關閉 Gemini 活動紀錄。</td></tr><tr><td>資料</td><td>含病歷、影像、語音、可識別個資或未公開院內資料嗎？能否改用模擬資料？</td></tr><tr><td>用途</td><td>輸入這些資料真的必要嗎？符合原本授權目的嗎？出現異常時如何停止與通報？</td></tr></table>\n<h3>輸出後：結果能不能使用</h3>\n<p class=\"ck\">☐ 來源：重要主張能否回到原始資料？來源可信、完整、尚在有效期內嗎？</p>\n<p class=\"ck\">☐ 內容：有沒有看似合理的錯誤（幻覺）、偏誤、不一致，或超出來源的推測？</p>\n<p class=\"ck\">☐ 適用性：內容即使正確，適合目前的病人、單位流程與使用情境嗎？</p>\n<p class=\"ck\">☐ 責任與透明：由具相應資格的人員確認了嗎？</p>\n<h3>與民眾互動或錄音錄影</h3>\n<p class=\"li\">• AI 直接與民眾互動時，主動揭露由 AI 系統運作，並提醒輸出可能出現錯誤。</p>\n<p class=\"li\">• 錄音錄影前說明必要性與用途限制；病人或家屬明確拒絕時，應停止錄製。</p>\n<p class=\"li\">• 錄音、錄影及相關資料，只能用於原先告知的目的範圍。</p>", "1.4": "<h2>1.4　參考資料</h2>\n<p class=\"li\">• 衛生福利部《醫療機構應用生成式人工智慧指引》PDF（素材資料夾）</p>\n<p class=\"li\">• PTCF 出處：Google Workspace《Gemini 提示詞指南》</p>", "2.1": "<h2>2.1　步驟</h2>\n<p class=\"li\">1. 開啟「文件格式萃取與複用助手」Gem。</p>\n<p class=\"li\">2. 上傳一份<strong>已填寫完成</strong>的文件，貼上提示詞 2-1。</p>\n<p class=\"li\">3. 用 <strong>Gate 1</strong> 檢查模板。</p>\n<p class=\"li\">4. 上傳新素材，貼上提示詞 2-2。</p>\n<p class=\"li\">5. 用 <strong>Gate 2</strong> 檢查新文件。</p>", "2.2": "<h2>2.2　Gem 連結</h2>\n<p><strong>文件格式萃取與複用助手</strong></p>\n<p><a href=\"https://gemini.google.com/gem/1RlUR_YuQcmudtIpTeX5Hv6JNuWLcCCK_?usp=sharing\" target=\"_blank\" rel=\"noopener\">https://gemini.google.com/gem/1RlUR_YuQcmudtIpTeX5Hv6JNuWLcCCK_?usp=sharing</a></p>\n<p class=\"note\">打不開 Gem 時：把「附錄 A」整段貼進 Gemini 新對話，再上傳文件，流程相同。貼到 ChatGPT 或 Claude 也可以使用。</p>", "2.3": "<h2>2.3　提示詞</h2>\n<div class=\"pbox\" data-pid=\"2-1\"></div>\n<div class=\"pbox\" data-pid=\"2-2\"></div>", "2.4": "<h2>2.4　檢查清單</h2>\n<h3>Gate 1　萃取完成後：模板抓得準不準？</h3>\n<p class=\"ck\">☐ 結構完整：章節與順序跟原文件一致</p>\n<p class=\"ck\">☐ 分得清楚：固定的、每次要換的，有分開</p>\n<p class=\"ck\">☐ 沒有夾帶：這一次的具體內容沒有留在模板裡</p>\n<h3>Gate 2　套用完成後：新文件寫得有沒有依據？</h3>\n<p class=\"ck\">☐ 有來源：內容都來自新素材</p>\n<p class=\"ck\">☐ 不補寫：資料不足時先問，不自己編</p>\n<p class=\"ck\">☐ 人把關：個資、專業內容與簽核由人確認</p>", "2.5": "<h2>2.5　卡住怎麼辦</h2>\n<p class=\"li\">• 影片讀不進去：改用素材資料夾的逐字稿。</p>\n<p class=\"li\">• Gem 打不開：使用附錄 A 的完整系統提示詞。</p>", "2.6": "<h2>2.6　回單位可以試的文件</h2>\n<p>跨科協調聯絡單、公文回覆、公告通知、教育訓練紀錄、交班紀錄。使用前先去識別化。</p>", "2.7": "<h2>2.7　課堂素材</h2>\n<table><tr><th>素材</th><th>說明</th></tr><tr><td>範本</td><td>疾管署性別平等工作小組會議紀錄（精簡版）PDF，素材資料夾</td></tr><tr><td>新素材</td><td>改善護理人員權益公聽會影片，使用 14:30–25:00：<a href=\"https://www.youtube.com/watch?v=XQRrkNJoMao\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=XQRrkNJoMao</a></td></tr></table>", "3.1": "<h2>3.1　步驟</h2>\n<p class=\"li\">1. 在 Gemini Notebook 放入兩份來源：您要教的教材（先去識別化）＋ 福哥〈教學的技術〉ADDIE 文章。</p>\n<p class=\"li\">2. 貼上提示詞 3-1，回答 AI 的訪談問題。</p>\n<p class=\"li\">3. 確認課程設定卡 → <strong>存成筆記 → 把筆記轉成來源</strong>（下一步才讀得到）。</p>\n<p class=\"li\">4. 貼上提示詞 3-2，產出課綱，用五項檢查確認。</p>\n<p class=\"li\">5. 貼上提示詞 3-3，產出簡報內容。</p>", "3.2": "<h2>3.2　提示詞</h2>\n<div class=\"pbox\" data-pid=\"3-1\"></div>\n<div class=\"pbox\" data-pid=\"3-2\"></div>\n<div class=\"pbox\" data-pid=\"3-3\"></div>", "3.3": "<h2>3.3　課綱五項檢查</h2>\n<p class=\"ck\">☐ 目標別太大：目標能不能在這個時數內達成</p>\n<p class=\"ck\">☐ 段落分得對：知識點有沒有被分成合理的教學段落</p>\n<p class=\"ck\">☐ 每段有教法：問答、討論、演練、影片，不能整堂都是講述</p>\n<p class=\"ck\">☐ 時間加得起來：分鐘數加總等於總時數</p>\n<p class=\"ck\">☐ 內容有依據：重要主張回得到來源；醫療與法規內容，正式使用前請院內專業人員複核</p>", "3.4": "<h2>3.4　卡住怎麼辦</h2>\n<p class=\"li\">• Notebook 不照做，或提示詞貼不進去：改到 Gemini 主站，從左側欄開啟同一本 Notebook，再貼一次。</p>\n<p class=\"li\">• AI 一次問好幾題：回覆「只問第一題」。</p>\n<p class=\"li\">• 輸出被截斷：回覆「每 5 頁分一批，繼續」。</p>", "3.5": "<h2>3.5　參考資料</h2>\n<p class=\"li\">• 福哥〈教學的技術〉談 ADDIE：<a href=\"https://afu.tw/1044\" target=\"_blank\" rel=\"noopener\">https://afu.tw/1044</a></p>\n<p class=\"li\">• 勞動部 TTQS〈以 ADDIE 模式探討訓練需求獲得之方法〉PDF（素材資料夾）</p>\n<p class=\"li\">• AIHR ADDIE 指南（英文，附模板）：<a href=\"https://www.aihr.com/blog/addie-model/\" target=\"_blank\" rel=\"noopener\">https://www.aihr.com/blog/addie-model/</a></p>", "4.1": "<h2>4.1　步驟</h2>\n<p class=\"li\">1. 想一個主題，回答三個問題：</p>\n<p class=\"li\">• 主題：您想做哪一張衛教？</p>\n<p class=\"li\">• 對象：這張給誰看？</p>\n<p class=\"li\">• 行動：看完希望他做什麼？</p>\n<p class=\"li\">2. <strong>技能卡 1　寫文案</strong>：貼上提示詞 4-1，同時上傳或貼上衛教資料。</p>\n<p class=\"li\">3. <strong>技能卡 2　挑風格</strong>：上傳一張喜歡的圖，貼上提示詞 4-2；或到 Banana X 複製現成風格。</p>\n<p class=\"li\">4. <strong>生成圖卡</strong>：在 Gemini 貼上提示詞 4-3。</p>\n<p class=\"li\">5. 用內容檢查與視覺檢查確認。</p>", "4.2": "<h2>4.2　提示詞</h2>\n<div class=\"pbox\" data-pid=\"4-1\"></div>\n<p>尺寸可以換成海報、IG 方圖（1080×1080）等。</p>\n<div class=\"pbox\" data-pid=\"4-2\"></div>\n<div class=\"pbox\" data-pid=\"4-3\"></div>", "4.3": "<h2>4.3　風格範本與樣板庫</h2>\n<table><tr><th>風格</th><th>範本</th></tr><tr><td>可愛風</td><td>臺北市社區營養推廣中心〈養肌出擊 肌少遠離〉</td></tr><tr><td>親和感</td><td>臺北市政府衛生局〈定期檢查小眼睛 保護眼睛亮晶晶〉</td></tr><tr><td>專業醫療感</td><td>Obesity Association〈Trauma-Informed Obesity Care〉</td></tr></table>\n<p class=\"li\">• <strong>Banana X 風格圖鑑</strong>：<a href=\"https://furoku.github.io/bananaX/\" target=\"_blank\" rel=\"noopener\">https://furoku.github.io/bananaX/</a>　挑一個風格，複製它的提示詞，取代提示詞 4-3 的「風格」。</p>\n<p class=\"li\">• <strong>BananaNL 擴充功能</strong>：Chrome 擴充功能，在 Gemini Notebook 做資訊圖表時一鍵套用風格。於 Chrome 線上應用程式商店搜尋「BananaNL」。</p>\n<p class=\"note\">使用前先確認院內資安規範；不輸入病人個資或院內機密。</p>", "4.4": "<h2>4.4　檢查清單</h2>\n<h3>內容檢查</h3>\n<p class=\"ck\">☐ 資訊正確：數字、資格、時程、建議與警語都能回到原始資料</p>\n<p class=\"ck\">☐ 內容完整：適用對象、必要條件、例外與行動方式沒有遺漏</p>\n<p class=\"ck\">☐ 目標達成：讀者看完能抓到重點，也知道下一步要做什麼</p>\n<p class=\"ck\">☐ 用語恰當：專業名詞有說明，不誇大風險，也不提供個別診療建議</p>\n<h3>視覺檢查</h3>\n<p class=\"ck\">☐ 中文正確：沒有錯字、亂碼或簡體字，專有名詞與單位寫法一致</p>\n<p class=\"ck\">☐ 閱讀順序：讀者一眼知道先看哪裡，再看哪裡</p>\n<p class=\"ck\">☐ 關聯清楚：標題、圖像、箭頭與文字相互對應，沒有造成錯誤因果</p>\n<p class=\"ck\">☐ 畫面易讀：字級、對比與留白足夠，重要訊息不會被裝飾搶走</p>\n<p class=\"ck\">☐ 重點保留：視覺化後沒有刪掉關鍵數字、條件、警語或資料來源</p>\n<p class=\"note\">圖卡仍是草稿；通過內容與視覺檢查，才能正式使用。</p>", "A": "<h2>附錄 A　文件格式萃取與複用助手</h2>\n<p>完整系統提示詞。Gem 打不開時，整段貼進 Gemini 新對話，送出後再上傳文件。</p>\n<div class=\"pbox\" data-pid=\"A\"></div>"}, "checklists": {"這些產出，先過人的檢查": ["來源回得去嗎？", "內容有沒有補寫？", "適合現在這個情境嗎？", "由誰簽名負責？"], "輸出後：結果能不能使用": ["來源：重要主張能否回到原始資料？來源可信、完整、尚在有效期內嗎？", "內容：有沒有看似合理的錯誤（幻覺）、偏誤、不一致，或超出來源的推測？", "適用性：內容即使正確，適合目前的病人、單位流程與使用情境嗎？", "責任與透明：由具相應資格的人員確認了嗎？"], "Gate 1　萃取完成後：模板抓得準不準？": ["結構完整：章節與順序跟原文件一致", "分得清楚：固定的、每次要換的，有分開", "沒有夾帶：這一次的具體內容沒有留在模板裡"], "Gate 2　套用完成後：新文件寫得有沒有依據？": ["有來源：內容都來自新素材", "不補寫：資料不足時先問，不自己編", "人把關：個資、專業內容與簽核由人確認"], "3.3": ["目標別太大：目標能不能在這個時數內達成", "段落分得對：知識點有沒有被分成合理的教學段落", "每段有教法：問答、討論、演練、影片，不能整堂都是講述", "時間加得起來：分鐘數加總等於總時數", "內容有依據：重要主張回得到來源；醫療與法規內容，正式使用前請院內專業人員複核"], "內容檢查": ["資訊正確：數字、資格、時程、建議與警語都能回到原始資料", "內容完整：適用對象、必要條件、例外與行動方式沒有遺漏", "目標達成：讀者看完能抓到重點，也知道下一步要做什麼", "用語恰當：專業名詞有說明，不誇大風險，也不提供個別診療建議"], "視覺檢查": ["中文正確：沒有錯字、亂碼或簡體字，專有名詞與單位寫法一致", "閱讀順序：讀者一眼知道先看哪裡，再看哪裡", "關聯清楚：標題、圖像、箭頭與文字相互對應，沒有造成錯誤因果", "畫面易讀：字級、對比與留白足夠，重要訊息不會被裝飾搶走", "重點保留：視覺化後沒有刪掉關鍵數字、條件、警語或資料來源"]}, "cards": {"1": {"n": "01", "name": "PTCF 溝通框架", "tag": "四個欄位，把腦中的想法一次說清楚。", "def": "用四個要素，把影響結果的資訊交代清楚。", "how": "寫提示詞前，依序想清楚四格：P 角色、T 任務、C 背景、F 格式，再一次交給 AI。", "when": "你知道要完成什麼，但需要更精準地說明需求。", "unlock": "不必再收藏別人的提示詞——你自己就能寫出最適合自己工作的完整提示詞。"}, "2": {"n": "02", "name": "範例萃取法", "tag": "給 AI 一份好文件，它幫你找出規則。", "def": "提供完成的範例，讓 AI 找出可以重複使用的規則。", "how": "給 AI 一份做好的文件，請它拆出固定結構、變動欄位與寫作規則；確認後，再放新資料套用。", "when": "工作經常重複，但很難把所有規則一次說完整。", "unlock": "重複性文件不用每次從零開始，AI 照著你單位的格式，產出同規格的新文件。"}, "3": {"n": "03", "name": "AI 訪談釐清法", "tag": "說不清楚？讓 AI 一題一題問你。", "def": "讓 AI 主動提問，找出還沒有想清楚的條件。", "how": "先說你大概想做什麼，請 AI 一次只問一題；資訊夠了，請它整理成摘要給你確認。", "when": "你知道大概要做什麼，但還無法一次說完整。", "unlock": "讓 AI 反過來訪問你，把沒想到的條件問出來，得到更完整、更貼近目的的需求。"}, "4": {"n": "04", "name": "AI 隨身教練", "tag": "給 AI 一篇文章，它照著帶你做。", "def": "讓 AI 讀取來源，再依你的程度陪你理解與操作。", "how": "把文章、影片或講義放進 Notebook，說明你的目標，請 AI 照著內容一次帶你做一步。", "when": "你找到想學的資料，但不知道從哪裡開始操作。", "unlock": "看到好方法不用自己摸索——AI 會照著那份資料，一步步帶你做出成果。"}}, "files": {"00_備料間/單元二_格式萃取與模板生成_教學素材/講師示範_Demo/疾管署_性別平等工作小組113年第2次會議紀錄_精簡範例.pdf": {"name": "疾管署_性別平等工作小組113年第2次會議紀錄_精簡範例.pdf", "data": "data:application/pdf;base64,JVBERi0xLjcNCiW1tbW1DQoxIDAgb2JqDQo8PC9UeXBlL0NhdGFsb2cvUGFnZXMgMiAwIFIvTGFuZyh6aC1UVykgL1N0cnVjdFRyZWVSb290IDIxIDAgUi9NYXJrSW5mbzw8L01hcmtlZCB0cnVlPj4vTWV0YWRhdGEgNDYwIDAgUi9WaWV3ZXJQcmVmZXJlbmNlcyA0NjEgMCBSPj4NCmVuZG9iag0KMiAwIG9iag0KPDwvVHlwZS9QYWdlcy9Db3VudCAzL0tpZHNbIDMgMCBSIDE2IDAgUiAxOCAwIFJdID4+DQplbmRvYmoNCjMgMCBvYmoNCjw8L1R5cGUvUGFnZS9QYXJlbnQgMiAwIFIvUmVzb3VyY2VzPDwvRm9udDw8L0YxIDUgMCBSL0YyIDEyIDAgUi9GMyAxNCAwIFI+Pi9FeHRHU3RhdGU8PC9HUzEwIDEwIDAgUi9HUzExIDExIDAgUj4+L1Byb2NTZXRbL1BERi9UZXh0L0ltYWdlQi9JbWFnZUMvSW1hZ2VJXSA+Pi9NZWRpYUJveFsgMCAwIDU5NS4zMiA4NDEuOTJdIC9Db250ZW50cyA0IDAgUi9Hcm91cDw8L1R5cGUvR3JvdXAvUy9UcmFuc3BhcmVuY3kvQ1MvRGV2aWNlUkdCPj4vVGFicy9TL1N0cnVjdFBhcmVudHMgMD4+DQplbmRvYmoNCjQgMCBvYmoNCjw8L0ZpbHRlci9GbGF0ZURlY29kZS9MZW5ndGggMjczND4+DQpzdHJlYW0NCnictVzLjh23Ed0PMP/Qy1EAtar4JjAQ0E8jQQwkkIIsbC+MwNEqQh7/D6Squltz5UuK9JjUQqPbunOneFh1Tj3IGd79ZXh+fvf98sd1gPfvh3ldhv88PsAI/CcEjwMMNtpRqyEYHKMa/vvL48Pf/zB8fnyYPz4+vNtxQDtGN3z85+MDvxsGeqLorWbwDkdF//Mvet93HxCGT/+jzx4+HS/xfPnd48MPzzC5HSYPiMGCC/P7t/4Z9n1//9Pw8U+PDxv9qL8+Pgzb98swvPvw758/fzEb3/3558+fhqdfPr/924c3r1uDSqxBAY4h3q5BLD/sfcI32tBfb/WTfpMy8QVW1Q5WpexoMGPSM1jQsARdhkz3gsz6UescZKoAlGkIlKPv8HmgcAYPBqxHMF6Lr216Br2A/Ns6BXqeYYkGdrfxM/R+gQgezWzLANtOAJOxow45gIcCwO7VAJsRzFeGWD0GskNpDvM7f     jump: (b) => el('div', { class: 'jump' }, b.items.map((x, i) => el('button', { type: 'button', class: get('seen:' + x[0]) ? 'seen' : '', onclick: () => go(SEG.findIndex((s) => s.id === x[0])) }, el('span', { class: 'num' }, String(i + 1)), x[1], get('seen:' + x[0]) ? ' ✓' : ''))),
    flow: (b) => el('div', { class: 'flow' }, b.items.map((t, i) => el('div', { class: b.gates.includes(i) ? 'g' : (i === b.items.length - 1 ? 'end' : '') }, t))),

    score: (b) => {

    scenario: (b) => {

        const a = el('input', { type: 'text', placeholder: '例：交班紀錄', 'aria-label': `我想到的文件 ${i + 1}` }); a.value = r[0];
        const w = el('input', { type: 'text', placeholder: '例：每天都寫、格式固定、常漏填', 'aria-label': `為什麼值得試 ${i + 1}` }); w.value = r[1];
        const on = () => { v[i] = [a.value, w.value]; set('scenario:' + b.key, v); status.textContent = '已存在這台電腦 ✓'; };
        a.oninput = on; w.oninput = on; inputs.push(a);
        return el('div', { class: 'row' }, el('div', {}, el('label', {}, `我想到的文件 ${i + 1}`), a), el('div', {}, el('label', {}, '為什麼值得試'), w));
      });
      return el('div', { class: 'scen' }, privacy(), rows, el('div', { class: 'hint' }, '想不到？點一下帶入：'),
        el('div', { class: 'chips' }, b.suggest.map((s) => el('button', { type: 'button', onclick: () => { const t = inputs.find((x) => !x.value) || inputs[inputs.length - 1]; t.value = s; t.oninput(); t.focus(); } }, s))), status);
    },
    think: (b) => {

      b.o.forEach((o, i) => opts.append(el('button', { type: 'button', onclick: () => { set('think:' + b.key, i); mark(i); } }, `${'ABCD'[i]}. ${o}`)));
      const w = el('div', { class: 'q think' }, el('h3', {}, b.q), opts, exp);
      if (get('think:' + b.key) != null) mark(get('think:' + b.key));

    },
    privacyNote: (b) => el('div', { class: 'privacy', role: 'note' }, '⚠️ ' + b.text),
    download: (b) => D.files && D.files[b.file] ? el('a', { class: 'btn', href: D.files[b.file].data, download: D.files[b.file].name }, '⬇ ' + b.label) : el('div', { class: 'wip' }, '範本檔待補'),
    links: (b) => el('div', { class: 'btns' }, b.items.map((x) => el('a', { class: 'btn ghost', href: x[1], target: '_blank', rel: 'noopener' }, x[0]))),
    takeaway: (b) => el('div', { class: 'takeaway' }, el('h3', {}, '這個單元，您帶走的三件事'), b.items.map((x, i) => el('div', {}, el('b', {}, `${String(i + 1).padStart(2, '0')}　${x[0]}`), el('span', {}, x[1])))),
  };

  function checks(key, title, items, note) {
    const v = get(key, []);
    const done = el('div', { class: 'done-msg' });
    const upd = () => { done.textContent = items.length && items.every((_, i) => v[i]) ? '全部檢查完成 ✓' : ''; };
    const box = el('div', { class: 'checks' }, title ? el('h3', {}, title) : null, items.map((t, i) => {
      const cb = el('input', { type: 'checkbox' }); cb.checked = !!v[i];
      cb.onchange = () => { v[i] = cb.checked; set(key, v); upd(); };
      return el('label', {}, cb, el('span', {}, t));
    }), note ? el('div', { class: 'gnote' }, note) : null, done);
    upd(); return box;
  }

  // ── 測驗 ──
  function quiz(seg, onChange) {
    const ans = get('quiz:' + seg.id, {});
    const score = el('div', { class: 'score' });
    const upd = () => {
      const n = seg.quiz.filter((q) => q in ans).length, r = seg.quiz.filter((q) => ans[q] === C.quiz[q].a).length;
      score.textContent = n < seg.quiz.length ? `已作答 ${n} / ${seg.quiz.length}，全部作答後才能到下一段` : r === seg.quiz.length ? `全對！${r} / ${seg.quiz.length} 題，可以進入下一段了。` : `答對 ${r} / ${seg.quiz.length} 題。答錯的題目看一下解說，再往下。`;
      onChange(n === seg.quiz.length);

        exp.innerHTML = ''; exp.append(el('b', { class: pick === Q.a ? 'ok' : 'no' }, pick === Q.a ? '答對了！' : `正確答案是 ${'ABCD'[Q.a]}。`), ' ' + Q.e);
      };
      Q.o.forEach((o, i) => opts.append(el('button', { type: 'button', onclick: () => { ans[qid] = i; set('quiz:' + seg.id, ans); mark(i); upd(); } }, `${'ABCD'[i]}. ${o}`)));
      if (qid in ans) mark(ans[qid]);
      return el('div', { class: 'q' }, el('h3', {}, `第 ${qi + 1} 題　${Q.q}`), opts, exp);
    });
    const retry = el('button', { class: 'btn ghost', type: 'button', onclick: () => { set('quiz:' + seg.id, {}); render(); } }, '重新作答');
    let cur = Math.max(0, seg.quiz.findIndex((q) => !(q in ans))); if (seg.quiz.every((q) => q in ans)) cur = seg.quiz.length - 1;
    const prevQ = el('button', { class: 'btn ghost', type: 'button' }, '‹ 上一題'), nextQ = el('button', { class: 'btn', type: 'button' }, '下一題 ›');
    const stepper = el('div', { class: 'qstep' });
    const show = () => {
      qs.forEach((q, i) => { q.hidden = i !== cur; });
      stepper.innerHTML = ''; seg.quiz.forEach((q, i) => stepper.append(el('span', { class: (i === cur ? 'on ' : '') + (q in ans ? (ans[q] === C.quiz[q].a ? 'ok' : 'no') : '') }, String(i + 1))));
      prevQ.disabled = cur === 0; nextQ.disabled = cur === seg.quiz.length - 1 || !(seg.quiz[cur] in ans);
    };
    prevQ.onclick = () => { cur--; show(); }; nextQ.onclick = () => { cur++; show(); };
    qs.forEach((q) => q.addEventListener('click', () => setTimeout(show, 0)));
    const w = el('div', { class: 'quiz' }, stepper, qs, el('div', { class: 'btns' }, prevQ, nextQ, score, retry));
    show(); upd(); return w;
  }

  // ── 導覽 ──
  let idx = 0, canNext = true;
  // 段落碼：單元-頁序（與側欄編號一致）
  SEG.forEach((s) => { s.n = SEG.filter((x) => x.unit === s.unit).indexOf(s) + 1; s.code = `${s.unit}-${s.n}`; });
  function unitDone(u) { const ss = SEG.filter((s) => s.unit === u); return ss.length && ss.every((s) => get('seen:' + s.id)); }
  function renderNav() {
    const nav = $('#units'); nav.innerHTML = '';
    C.units.forEach((u) => nav.append(el('button', { type: 'button', class: (SEG[idx].unit === u.id ? 'on' : '') + (unitDone(u.id) ? ' done' : ''), onclick: () => go(SEG.findIndex((s) => s.unit === u.id)) }, u.label)));
    const cur = SEG[idx], unit = C.units.find((u) => u.id === cur.unit), list = SEG.filter((s) => s.unit === cur.unit);
    const side = $('#side'); side.innerHTML = '';
    side.append(el('div', { class: 'side-h' }, `${unit.label}｜${unit.title}`));
    list.forEach((s) => side.append(el('button', { type: 'button', class: 'side-i' + (s === cur ? ' on' : '') + (get('seen:' + s.id) ? ' seen' : '') + (s.slide ? '' : ' act'), onclick: () => { side.classList.remove('open'); go(SEG.indexOf(s)); } },
      el('span', { class: 'no' }, String(s.n)), el('span', { class: 'tt' }, s.title), s.quiz ? el('span', { class: 'tag' }, '測驗') : (!s.slide || s.blocks ? el('span', { class: 'tag' }, '互動') : null))));
    $('#count').textContent = `${cur.n} / ${list.length}`;
    $('#bar').style.width = (cur.n / list.length * 100) + '%';
    $('#pos').textContent = `${unit.label}　第 ${cur.n} 頁／共 ${list.length} 頁`;
    $('#prev').disabled = idx === 0;
    $('#next').disabled = idx === SEG.length - 1 || !canNext;
    $('#next').title = canNext ? '' : '先完成這一段的小測驗';
  }
  function render() {
    const seg = SEG[idx]; const st = $('#stage'); st.innerHTML = '';
    const unit = C.units.find((u) => u.id === seg.unit);
    canNext = true;
    st.classList.toggle('is-slide', !!seg.slide && !seg.blocks && !seg.quiz);
    const ul = seg.unlock ? [].concat(seg.unlock) : [];
    ul.forEach((n) => set('unlock:' + n, true));
    if (seg.slide && !seg.blocks && !seg.quiz) {
      const acts = (seg.actions || []).map((a) => {
        if (a.copy) return el('button', { class: 'btn', type: 'button', onclick: () => copy(D.prompts[a.copy].text) }, '📋 ' + (a.label || '複製提示詞 ' + a.copy));
        if (a.open) return el('button', { class: 'btn ' + (a.open === 'gem' ? 'dark' : 'ghost'), type: 'button', onclick: () => openTool(a.open) }, '開啟 ' + C.tools[a.open].name);
        if (a.link) return el('a', { class: 'btn ghost', href: a.link, target: '_blank', rel: 'noopener' }, a.label);
        if (a.drawer) return el('button', { class: 'btn ghost', type: 'button', onclick: () => openDrawer(a.drawer, a.label) }, '📖 ' + a.label);
        if (a.mine) return el('button', { class: 'btn', type: 'button', onclick: mine }, a.label);
      });
      st.append(el('div', { class: 'slide-bar' }, el('span', { class: 'seg-code' }, seg.code), el('span', { class: 'slide-t' }, seg.title), el('div', { class: 'btns' }, acts)));
      st.append(el('figure', { class: 'slide' }, el('img', { src: `slides/${String(seg.slide).padStart(2, '0')}.jpg`, alt: `投影片 ${seg.slide}：${seg.title}`, loading: 'eager' })));
      set('seen:' + seg.id, true); $('#presentCode').textContent = seg.code; renderNav(); return;
    }
    st.append(el('div', { class: 'seg-head' }, el('span', { class: 'seg-code' }, seg.code, el('span', { class: 'u' }, `${unit.label}${seg.unit && seg.unit < 5 ? '　' + unit.title : ''}`)), el('h1', {}, seg.title), seg.sub ? el('p', { class: 'sub' }, seg.sub) : null));
    if (ul.length) {
      const cards = ul.map((n) => skillCard(n));
      st.append(el('div', { class: 'block unlock-hero' + (ul.length > 1 ? ' two' : '') }, el('div', {}, el('div', { class: 'confetti' }, '🎉 技能卡已解鎖'), el('div', { class: 'ucards' }, cards)), R.takeaway(seg.blocks[0])));
      setTimeout(() => cards.forEach((c) => c.classList.add('on')), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 500);
      seg.blocks.slice(1).forEach((b) => st.append(el('div', { class: 'block' }, R[b.type](b, seg, st))));
    } else {
      const mk = (b) => el('div', { class: 'block' }, R[b.type] ? R[b.type](b, seg, st) : el('div', { class: 'wip' }, '未知區塊 ' + b.type));
      if (seg.layout === 'split') st.append(el('div', { class: 'split' }, el('div', {}, mk(seg.blocks[0])), el('div', {}, seg.blocks.slice(1).map(mk))));
      else (seg.blocks || []).forEach((b) => st.append(mk(b)));
    }
    if (seg.quiz) { canNext = false; st.append(el('div', { class: 'block' }, quiz(seg, (ok) => { canNext = ok; renderNav(); }))); }
    set('seen:' + seg.id, true);
    $('#presentCode').textContent = seg.code;
    renderNav();
  }
  function quizDone(s) { const a = get('quiz:' + s.id, {}); return s.quiz.every((q) => q in a); }
  function go(i) {
    if (i < 0 || i >= SEG.length) return;
    if (i > idx) { const block = SEG.findIndex((s, k) => k >= idx && k < i && s.quiz && !quizDone(s)); if (block >= 0) { if (block !== idx) setTimeout(() => toast('先完成小測驗，才能往後跳'), 50); else { toast('先完成這一段的小測驗'); return; } i = block; } }
    closeDrawer(); $('#toast').classList.remove('on'); idx = i; history.replaceState(null, '', '#' + SEG[i].code); render();
    window.scrollTo({ top: 0 }); $('#stage').focus({ preventScroll: true });
  }
  $('#prev').onclick = () => go(idx - 1);
  $('#next').onclick = () => canNext && go(idx + 1);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') return closeDrawer();
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || $('#drawer').classList.contains('open')) return;
    if (e.key === 'ArrowRight' && canNext) go(idx + 1);
    if (e.key === 'ArrowLeft') go(idx - 1);
  });
  $('#tocBtn').onclick = () => $('#side').classList.toggle('open');
  const start = SEG.findIndex((s) => '#' + s.id === location.hash || '#' + s.code === location.hash);
  idx = start >= 0 ? start : 0;
  render();
})();
