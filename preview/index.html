const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'kt-gate-' + location.pathname;
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(D.s), iterations:D.i, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b(D.v)}, key, b(D.c)));
  try { sessionStorage.setItem(KEY, pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try { await unlock(document.getElementById('pw').value.trim()); }
  catch (x) { err.textContent = '密碼不正確，請再試一次。'; go.disabled = false; }
});
